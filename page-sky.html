function req(){if(!raf)raf=requestAnimationFrame(function(){raf=0;draw();});}
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;hideHint();
  var ids=Object.keys(ptrs);if(ids.length===1)drag={x:e.clientX,y:e.clientY,az:view.az,alt:view.alt};
  else if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),fov:view.fov};drag=null;}});
cv.addEventListener("pointermove",function(e){if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptrs);
  if(pinch&&ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);view.fov=clamp(pinch.fov*pinch.d/d,20,140);moved=99;req();return;}
  if(drag){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));var dpp=view.fov/Math.min(W,H*1.1);
    view.az=rev(drag.az-dx*dpp);view.alt=clamp(drag.alt+dy*dpp,-25,90);req();}});
function up(e){var wasTap=drag&&moved<8&&Object.keys(ptrs).length===1;delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;
  if(wasTap)tap(e.clientX,e.clientY);if(!Object.keys(ptrs).length)drag=null;}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",function(e){delete ptrs[e.pointerId];drag=null;pinch=null;});
cv.addEventListener("wheel",function(e){e.preventDefault();view.fov=clamp(view.fov*Math.exp(e.deltaY*0.0012),20,140);req();},{passive:false});

function tap(x,y){var best=null,bd=26;
  // his named first
  HIS.forEach(function(h){var p=anchorFor(h.key);if(!p)return;var d=Math.hypot(p.x-x,p.y-y);if(h.key==="TWINS"){var a=proj(scene.starById.cas.v),b=proj(scene.starById.pol.v);if(a)d=Math.min(d,Math.hypot(a.x-x,a.y-y));if(b)d=Math.min(d,Math.hypot(b.x-x,b.y-y));}
    if(h.key==="PLEIADES"){PLEI.forEach(function(id){var q=proj(scene.starById[id].v);if(q)d=Math.min(d,Math.hypot(q.x-x,q.y-y));});}
    if(d<bd){bd=d;best={kind:"his",key:h.key};}});
  if(!best){(scene.screen||[]).forEach(function(s){var d=Math.hypot(s.x-x,s.y-y)-s.r*0.5;if(d<bd){bd=d;
      best=s.type==="star"?{kind:"star",id:s.o.s.id}:s.type==="planet"?{kind:"planet",name:s.o.name}:{kind:"his",key:"MOON"};}});}
  if(!best&&showLines){var bc=null,bdd=12;Object.keys(LINES).forEach(function(c){LINES[c].forEach(function(l){var p=proj(scene.starById[l[0]].v),q=proj(scene.starById[l[1]].v);if(!p||!q)return;
      var d=segDist(x,y,p,q);if(d<bdd){bdd=d;bc=c;}});});if(bc)best={kind:"con",con:bc};}
  if(best&&best.kind==="star"&&HISBY[best.id])best={kind:"his",key:best.id};
  if(best&&best.kind==="star"&&(PLEI.indexOf(best.id)>=0))best={kind:"his",key:"PLEIADES"};
  if(best&&best.kind==="star"&&(best.id==="cas"||best.id==="pol"))best={kind:"his",key:"TWINS"};
  if(best&&best.kind==="planet"&&HISBY[best.name])best={kind:"his",key:best.name};
  if(best){selected=best;openCard();}else{closeAll();}
  draw();}
function segDist(x,y,p,q){var dx=q.x-p.x,dy=q.y-p.y,l=dx*dx+dy*dy;if(!l)return Math.hypot(x-p.x,y-p.y);var t=clamp(((x-p.x)*dx+(y-p.y)*dy)/l,0,1);return Math.hypot(x-p.x-t*dx,y-p.y-t*dy);}

/* ---------- Cards ---------- */
var card=document.getElementById("card"),body=document.getElementById("cardBody"),drawer=document.getElementById("drawer");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function posLine(alt,az){var dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return alt<0?"<span><b>"+Math.round(-alt)+"°</b> below the horizon</span>":"<span>alt <b>"+Math.round(alt)+"°</b></span><span>az <b>"+Math.round(az)+"°</b> "+dirs[Math.round(az/22.5)%16]+"</span>";}
function hisPos(key){if(key==="MOON")return scene.moon;if(key==="PLEIADES")return scene.starById.alc;if(key==="TWINS")return scene.starById.pol;
  if(PL[key])return scene.planets.filter(function(x){return x.name===key;})[0];return scene.starById[key];}
function openCard(){drawer.classList.add("closed");var h="";
  if(selected.kind==="his"){var x=HISBY[selected.key],p=hisPos(selected.key);
    h='<div class="eyebrow">Renamed by S.H.</div><h2 class="hisname">'+esc(x.his)+'</h2>'+
      '<div class="meta"><span><b>'+esc(x.real)+'</b></span></div><div class="meta">'+x.meta.map(function(m){return "<span>"+esc(m)+"</span>";}).join("")+'</div>'+
      '<div class="meta">'+posLine(p.alt,p.az)+'<span>at '+clockStr()+'</span></div>'+
      '<p class="fact">'+esc(x.fact)+'</p><p class="note">'+esc(x.note)+'<span class="sig">S.</span></p>';}
  else if(selected.kind==="star"){var o=scene.starById[selected.id],s=o.s,mine=MINE[s.id];
    h='<div class="eyebrow">'+esc(C[s.con]||s.con)+'</div>'+(mine?'<h2 class="yourname">'+esc(mine)+'</h2>':'')+'<h2 class="realname">'+esc(s.name)+'</h2>'+
      '<div class="meta"><span>mag <b>'+s.mag.toFixed(2)+'</b></span>'+posLine(o.alt,o.az)+'</div>'+
      (CFACT[s.con]?'<p class="fact">'+esc(CFACT[s.con])+'</p>':'')+
      (mine?'<p class="reply" id="reply"></p><button class="textbtn" id="unname">Remove your name</button>':
      '<div class="eyebrow">He hasn\'t named this one. You can.</div><form class="nameform" id="nameform"><input id="starname" maxlength="40" placeholder="Name this star" autocomplete="off" aria-label="Your name for this star"><button type="submit">Name it</button></form><p class="reply" id="reply"></p>');}
  else if(selected.kind==="planet"){var pl=scene.planets.filter(function(x){return x.name===selected.name;})[0];
    var pf={Jupiter:"The largest planet, more than twice the mass of all the others combined. This morning it sits just above and to the right of Regulus in the east, with Mars a little higher still.",Saturn:"A few weeks past opposition, so still bright and well placed, sinking in the west. Its rings are almost edge-on to us in this period, so they still look thin in a telescope.",Venus:"Below the horizon at 4:27, close to the Sun in the sky."}[pl.name]||"";
    h='<div class="eyebrow">Planet</div><h2 class="realname">'+pl.name+'</h2><div class="meta"><span><b>'+(pl.au*149.6).toFixed(0)+'</b> million km</span>'+posLine(pl.alt,pl.az)+'</div><p class="fact">'+esc(pf)+'</p>';}
  else if(selected.kind==="con"){h='<div class="eyebrow">Constellation</div><h2 class="realname">'+esc(C[selected.con])+'</h2><p class="fact">'+esc(CFACT[selected.con]||"")+'</p>';}
  body.innerHTML=h;card.classList.remove("closed");
  var f=document.getElementById("nameform");if(f)f.addEventListener("submit",function(ev){ev.preventDefault();var v=document.getElementById("starname").value.trim();if(!v)return;
    MINE[selected.id]=v;saveMine();renderLists();openCard();var r=document.getElementById("reply");if(r)r.textContent="“"+REPLIES[Math.floor(Math.random()*REPLIES.length)]+"” S.";draw();});
  var u=document.getElementById("unname");if(u)u.addEventListener("click",function(){delete MINE[selected.id];saveMine();renderLists();openCard();draw();});}
function closeAll(){card.classList.add("closed");drawer.classList.add("closed");selected=null;draw();}
document.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",closeAll);});

function renderLists(){var lh=document.getElementById("listHis"),lm=document.getElementById("listMine");
  lh.innerHTML=HIS.map(function(x){return '<li><button class="row" data-his="'+x.key+'"><span class="a">'+esc(x.his)+'</span><span class="c">'+(hisPos(x.key).alt<0?"below":"up")+'</span><span class="b">'+esc(x.real)+'</span></button></li>';}).join("");
  var ids=Object.keys(MINE);lm.innerHTML=ids.length?ids.map(function(id){var s=BYID[id];return '<li><button class="row mine" data-star="'+id+'"><span class="a">'+esc(MINE[id])+'</span><span class="b">'+esc(s?s.name:id)+'</span></button></li>';}).join(""):
   '<li><p class="empty">None yet. Tap any star without one of his names on it, and give it yours.</p></li>';
  lh.querySelectorAll("[data-his]").forEach(function(b){b.addEventListener("click",function(){selected={kind:"his",key:b.dataset.his};lookAt(hisPos(b.dataset.his));openCard();});});
  lm.querySelectorAll("[data-star]").forEach(function(b){b.addEventListener("click",function(){selected={kind:"star",id:b.dataset.star};lookAt(scene.starById[b.dataset.star]);openCard();});});}
function lookAt(o){if(!o)return;view.az=o.az;view.alt=clamp(o.alt,-20,85);draw();}
document.getElementById("openList").addEventListener("click",function(){renderLists();card.classList.add("closed");drawer.classList.remove("closed");});
var tabH=document.getElementById("tabHis"),tabM=document.getElementById("tabMine");
function tab(m){tabH.setAttribute("aria-selected",!m);tabM.setAttribute("aria-selected",m);document.getElementById("listHis").hidden=m;document.getElementById("listMine").hidden=!m;}
tabH.addEventListener("click",function(){tab(false);});tabM.addEventListener("click",function(){tab(true);});

/* ---------- Time & toggles ---------- */
var range=document.getElementById("time"),clock=document.getElementById("clock"),home=document.getElementById("home");
function clockStr(){var m=240+tMin;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function setTime(v){tMin=v;range.value=v;clock.textContent=clockStr();home.disabled=(v===27);computeScene();draw();if(!card.classList.contains("closed")&&selected)openCard();}
range.addEventListener("input",function(){setTime(parseInt(range.value,10));});
home.addEventListener("click",function(){setTime(27);});
function toggle(btn,fn){btn.addEventListener("click",function(){var on=btn.getAttribute("aria-pressed")!=="true";btn.setAttribute("aria-pressed",on);fn(on);draw();});}
toggle(document.getElementById("tLines"),function(v){showLines=v;});
toggle(document.getElementById("tNames"),function(v){showNames=v;});

var hint=document.getElementById("hint");function hideHint(){hint.classList.add("gone");}setTimeout(hideHint,6000);

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){draw();});
computeScene();resize();
})();
</script>
