<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Album</title>
<meta name="theme-color" content="#171214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Caveat:wght@500;600&family=Inter:wght@500;600&family=Pinyon+Script&display=swap">
<style>
:root{--dusk:#171214;--blush:#E9D2C7;--blush-2:#F3E6E0;--rouge:#8E5F68;--rouge-deep:#6E3F48;--ivory:#FBF7F3;--ink:#2F2426;--soft:#7A6A6C;--leather:#4a2a2c;--gold:#C9A46A;
 --serif:'Cormorant Garamond',Georgia,serif;--hand:'Caveat',cursive;--ui:'Inter',system-ui,sans-serif;--script:'Pinyon Script',cursive;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--dusk)}
body{min-height:100vh;color:var(--blush);font-family:var(--serif);overflow-x:hidden;
 background:radial-gradient(120% 60% at 50% -5%,#3A2A2F 0%,rgba(23,18,20,0) 62%),var(--dusk);
 padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(130px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
.goback{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:50;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:20px;background:rgba(34,26,29,.82);border:1px solid rgba(233,210,199,.16);color:var(--blush);font:600 13px var(--ui);text-decoration:none}
.wrap{max-width:520px;margin:0 auto}
/* cover */
.cover{position:relative;border-radius:6px 14px 14px 6px;padding:44px 26px 40px;text-align:center;overflow:hidden;
 background:radial-gradient(90% 70% at 30% 20%,rgba(255,220,190,.10),transparent 60%),linear-gradient(160deg,#5b3336,#3a1f22 60%,#2a1517);
 box-shadow:0 24px 50px -20px rgba(0,0,0,.85),inset 10px 0 18px -10px rgba(0,0,0,.6)}
.cover:before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,164,106,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 11px var(--ui);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.cover h1{font:italic 500 44px/1 var(--serif);margin:14px 0 6px;color:#ecd2b8}
.cover p{margin:0;font:italic 18px var(--serif);color:#d8b9a3}
.cover .mono{display:inline-grid;place-items:center;width:58px;height:58px;margin-top:18px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font:italic 22px var(--serif)}
.views{display:flex;gap:8px;justify-content:center;margin:18px 0 14px}
.views button{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(233,210,199,.2);background:transparent;font:600 13px var(--ui);color:var(--blush);cursor:pointer}
.views button[aria-pressed=true]{background:var(--rouge);border-color:var(--rouge);color:#fff}
/* page */
.page{position:relative;background:var(--ivory);color:var(--ink);border-radius:4px;padding:20px 18px 18px;
 box-shadow:0 30px 60px -24px rgba(0,0,0,.8),inset 12px 0 14px -12px rgba(0,0,0,.25);
 background-image:radial-gradient(140% 70% at 100% 0%,rgba(233,210,199,.35),transparent 55%)}
.page .top{display:flex;justify-content:space-between;align-items:baseline;font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
.mount{position:relative;margin:4px auto 0;padding:10px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:rotate(-.8deg);max-width:100%}
.mount img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#eee}
.cn{position:absolute;width:24px;height:24px}
.cn:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#3a2224 50%,transparent 50%)}
.cn.a{left:-4px;top:-4px}.cn.b{right:-4px;top:-4px;transform:rotate(90deg)}.cn.c{right:-4px;bottom:-4px;transform:rotate(180deg)}.cn.d{left:-4px;bottom:-4px;transform:rotate(270deg)}
.cap{font:600 26px/1.15 var(--hand);color:var(--rouge-deep);margin:18px 4px 6px;text-align:center}
.reveal{display:block;margin:10px auto 0;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(142,95,104,.35);background:transparent;color:var(--rouge);font:600 13px var(--ui);cursor:pointer}
.note{margin:12px 2px 0;padding:14px 16px;border-radius:10px;background:var(--blush-2);font:19px/1.55 var(--serif);color:var(--ink)}
.note .s{display:block;text-align:right;font:28px var(--script);color:var(--rouge);margin-top:4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.nav button{min-width:48px;min-height:48px;border-radius:24px;border:1px solid rgba(233,210,199,.2);background:rgba(34,26,29,.7);color:var(--blush);font:600 20px var(--ui);cursor:pointer}
.nav button:disabled{opacity:.3}
.nav .n{font:italic 17px var(--serif);color:#c9aaa2}
.turn{animation:turn .45s cubic-bezier(.3,.7,.2,1)}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,24px)) rotate(.6deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid button{position:relative;aspect-ratio:3/4;border:0;padding:6px;background:#fff;border-radius:2px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.grid button:nth-child(odd){transform:rotate(-1.4deg)}.grid button:nth-child(even){transform:rotate(1.2deg)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.empty{text-align:center;font:italic 19px var(--serif);color:#c9aaa2;padding:40px 10px}
:focus-visible{outline:2px solid var(--blush);outline-offset:3px}
</style>
</head><body>
<a class="goback" href="index.html" aria-label="Back to 221B">&#8249; 221B</a>
<div class="wrap">
  <section class="cover" aria-label="Album cover">
    <div class="k">221B Baker Street</div>
    <h1>Our Album</h1>
    <p>Kept by both of us. Captions by him.</p>
    <span class="mono" aria-hidden="true">S&amp;A</span>
  </section>
  <div class="views" role="group" aria-label="View">
    <button type="button" id="v-book" aria-pressed="true">Turn the pages</button>
    <button type="button" id="v-grid" aria-pressed="false">All at once</button>
  </div>
  <main id="book"></main>
</div>
<script src="photos.js"></script>
<script>
(function(){
var P=(window.PHOTOS||[]).slice(), book=document.getElementById('book'), i=0, mode='book', touchX=null;
try{ i=Math.min(+localStorage.getItem('album-page')||0, Math.max(0,P.length-1)); }catch(e){}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dateOf(p){var m=/\((\d{1,2} \w{3})\)\s*$/.exec(p.about||'');return m?m[1]+' 2026':''}
function save(){try{localStorage.setItem('album-page',i)}catch(e){}}
function renderBook(dx){
  if(!P.length){book.innerHTML='<p class="empty">No photographs yet. Send him one.</p>';return}
  var p=P[i];
  book.innerHTML='<article class="page turn" style="--dx:'+(dx||0)+'px" aria-label="Page '+(i+1)+' of '+P.length+'">'+
   '<div class="top"><span>Plate '+String(i+1).padStart(2,'0')+'</span><span>'+esc(dateOf(p))+'</span></div>'+
   '<figure class="mount" style="margin:0 auto"><span class="cn a"></span><span class="cn b"></span><span class="cn c"></span><span class="cn d"></span>'+
   '<img src="'+esc(p.src)+'" alt="'+esc((p.about||'').replace(/\s*\(\d.*$/,''))+'"></figure>'+
   '<p class="cap">'+esc(p.caption||'')+'</p>'+
   (p.note?'<button type="button" class="reveal" aria-expanded="false">Read his note</button><div class="note" hidden>'+esc(p.note)+'<span class="s">S.</span></div>':'')+
   '</article>'+
   '<div class="nav"><button type="button" id="prev" aria-label="Previous page"'+(i===0?' disabled':'')+'>&#8249;</button><span class="n">'+(i+1)+' of '+P.length+'</span><button type="button" id="next" aria-label="Next page"'+(i===P.length-1?' disabled':'')+'>&#8250;</button></div>';
  var r=book.querySelector('.reveal');
  if(r) r.onclick=function(){var n=book.querySelector('.note');var o=n.hidden;n.hidden=!o;r.setAttribute('aria-expanded',o);r.textContent=o?'Fold it away':'Read his note'};
  document.getElementById('prev').onclick=function(){go(-1)};
  document.getElementById('next').onclick=function(){go(1)};
}
function go(d){var j=i+d;if(j<0||j>=P.length)return;i=j;save();renderBook(d>0?24:-24);window.scrollTo({top:book.offsetTop-80,behavior:'smooth'})}
function renderGrid(){
  book.innerHTML=P.length?'<div class="grid">'+P.map(function(p,k){return '<button type="button" data-k="'+k+'" aria-label="Open plate '+(k+1)+': '+esc(p.caption||'')+'"><img src="'+esc(p.src)+'" alt="" loading="lazy"></button>'}).join('')+'</div>':'<p class="empty">No photographs yet.</p>';
  book.querySelectorAll('.grid button').forEach(function(b){b.onclick=function(){i=+b.dataset.k;save();setMode('book')}});
}
function setMode(m){mode=m;document.getElementById('v-book').setAttribute('aria-pressed',m==='book');document.getElementById('v-grid').setAttribute('aria-pressed',m==='grid');m==='book'?renderBook(0):renderGrid()}
document.getElementById('v-book').onclick=function(){setMode('book')};
document.getElementById('v-grid').onclick=function(){setMode('grid')};
document.addEventListener('keydown',function(e){if(mode!=='book')return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
book.addEventListener('touchstart',function(e){if(mode==='book')touchX=e.touches[0].clientX},{passive:true});
book.addEventListener('touchend',function(e){if(touchX===null)return;var dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});
setMode('book');
})();
</script>
<script src="tellhim.js"></script>
</body></html>
