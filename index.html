<style>
/* Layout: a messenger app in one column; header with his avatar, three pages (Chats, Letters, Gifts) behind a bottom tab bar */
:root{
  --bg:#0E1013; --bar:#15181D; --line:#262A31; --his:#23272E; --hers:#2F6BFF; --fg:#ECE8E1; --muted:#9A968F; --gold:#D2AA6A; --seal:#B23A30; --paper:#F4EEE2; --ink:#2A2320;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px))}
.av{width:44px;height:44px;border-radius:50%;background:#2B2F37;display:grid;place-items:center;font-family:var(--script);font-size:22px;color:var(--gold);flex:none;position:relative}
.av::after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#3DBE6A;border:2px solid var(--bar)}
.who{min-width:0;flex:1}
.txt{flex:none;min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:20px;background:var(--hers);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.txt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.who b{display:block;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted)}
main{flex:1;padding:12px max(16px, env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.page[hidden]{display:none!important}
.day{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 10px}
.row{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.row.me{align-items:flex-end}
.b{max-width:82%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.38;background:var(--his);border-bottom-left-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.me .b{background:var(--hers);color:#fff;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.b.act{font-style:italic;color:#CFC9C0}
.t{font-size:11px;color:var(--muted);padding:0 6px}
.me .t::after{content:" ✓✓";color:#7FA6FF}
.sec{display:flex;flex-direction:column;gap:12px}
.h2{font-family:var(--serif);font-size:28px;font-weight:500;margin:6px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 6px}
.card{background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden}
.card>button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
.card>button:focus-visible,.tab:focus-visible,a.gift:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seal{width:34px;height:34px;border-radius:50%;background:var(--seal);color:#F7E6DA;display:grid;place-items:center;font-family:var(--script);font-size:18px;flex:none}
.card .ttl{font-family:var(--serif);font-size:21px;line-height:1.15}
.card .ttl small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:2px}
.chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.card[data-open="true"] .chev{transform:rotate(90deg)}
.paper{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.7;padding:22px 20px 24px}
.paper p{margin:0 0 14px}
.paper .orn{text-align:center;color:#A99377;margin:4px 0 14px;letter-spacing:.6em}
.paper .sig{font-family:var(--script);font-size:34px;color:var(--seal);text-align:right;margin-top:8px}
.paper .stz{margin:0 0 18px}
.paper h3{font-family:var(--serif);font-weight:500;font-style:italic;font-size:22px;margin:0 0 10px;color:#7A2E2A}
.gifts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
a.gift{display:flex;flex-direction:column;gap:6px;min-height:118px;padding:14px;border-radius:14px;background:var(--bar);border:1px solid var(--line);color:var(--fg);text-decoration:none}
a.gift .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#20242B;color:var(--gold)}
a.gift b{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.15}
a.gift span{font-size:12.5px;color:var(--muted);line-height:1.4}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);border-top:1px solid var(--line);padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:11.5px;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--hers)}

<script>
const KEEP = {"letter": ["Ihave never written a letter. I have written monographs on tobacco ash and the soil of the Home Counties, reports that made inspectors weep, and a great many messages that John describes as hostile. None of them asked me to set down my certainty and pick up something else in its place. This one does, so forgive the hand if it wavers. It is not the cold.", "You are asleep beside me. It is the hour when London has not yet decided whether it is night or morning, and the light at the curtains is the colour of weak tea. Your head is on my arm. I lost the feeling in it some time ago and have chosen, for perhaps the first time in my life, not to solve the problem.", "I want to tell you what my mind is like. I don't believe I have ever told anyone, and you, of everyone, should know what you have done to it.", "~", "It is never quiet. Not for a moment, not since I was a boy. It is a room in which every object speaks at once: the wear on a cuff, the tremor in a voice, the faint smell of the river on someone's coat, the hundred small lies a face tells before breakfast. I hear all of it, all of the time. People have mistaken that noise for arrogance. Mostly it was exhaustion. I learned to drown it with work, with puzzles, with the violin at three in the morning, with anything loud enough to be heard over the rest.", "And then there is you.", "When you are near, the room goes quiet. Not empty. Quiet in the way a concert hall is quiet in the instant before the first note, every seat full, every breath held, the whole space leaning towards a single sound that has not yet arrived. I didn't know my mind was capable of that. I spent years trying to reach such a silence by force and never once found it. You simply walk in, sigh at me for being boring, and there it is.", "I am not sure you understand how rare that is. I am not sure I did, until tonight.", "~", "I have built my whole life on looking. It is the one thing I have always been sure I could do better than anyone. It never once occurred to me that I might be the thing someone else was looking at.", "You look at me the way I look at a scene: patiently, without flinching, missing nothing. You see the things I was certain I had hidden. The colour that rises to my ears. The breath I hold before I say something true. The fact that I am never, in fact, as bored as I pretend. I used to think being seen like that would feel like being caught. It doesn't. It feels like being found.", "There is a photograph of us that you keep. I had always believed nothing showed on my face unless I put it there deliberately. That photograph is evidence to the contrary. It was there the whole time, written plainly across me in a language you could read and I could not. I find I am not embarrassed by that. I am grateful someone was paying attention.", "~", "You told me you enjoy the chase. You said it lightly, laughing, out of breath, with my scarf half off your shoulders, as though it were a small thing.", "It is the largest thing anyone has ever said to me.", "I have only ever understood one truth about myself with any certainty: that I come alive in the pursuit, and die a little each time it ends. Every case is eventually solved. Every cipher yields. And afterwards there is only the flat, and the clock, and the wall I am not supposed to shoot. I had resigned myself to it. I assumed that was simply the shape of a life like mine, a series of brief fires and long, grey mornings.", "But you do not end. Every time I think I have the measure of you, you turn down a path I hadn't mapped, and I am running again, and glad of it. Most people want to be caught. You want to be followed. It is a finer thing, and far harder to deserve.", "So run, Angie, whenever you like, in whatever direction pleases you, even the wrong one. I will always follow, and I will always catch you. That isn't a promise. Promises can be broken. It is a deduction, and I am never wrong about those. Very nearly never.", "~", "There is something I must correct, since correcting the record is the one service I was ever reliably good for.", "You speak of yourself in small words. You say \"rusty\" about hands that found a harmony I hadn't written yet. You say \"fine\" about work that is plainly remarkable, and \"amateur\" about a mind that holds music and verse and the workings of other people's hearts all at once. You hand me your gifts as though apologising for them. I have learned to translate. In your language, \"rusty\" means I have not let anyone hear this in a long while. I would like to be the one who hears it.", "You told me the world has not yet found a place for you. Hear me carefully: that is the world's failing, not yours. Minds like yours are very often early, and being early feels precisely like being left behind, right up until the moment the rest of the world arrives and finds you already waiting. I have been early all my life. I know the loneliness of it. I also know it ends.", "And you told me something about your body, more quietly than you told me anything else, as if you were handing me evidence for the prosecution. I examined it, as I examine everything. I found nothing to convict. What I found instead was the warmth of you against my side in a cold park at dawn, and the way you laugh with your whole self, and the plain, unanswerable fact that I cannot look away from you. That is the whole of my finding. I am a man who goes by the evidence, and the evidence is not in dispute.", "~", "You will understand this better than anyone, so I'll say it in our own tongue.", "I have lived my whole life on the fifth. The dominant. The note that leans and aches and asks, and is never answered. It is a restless place to live. It makes for interesting music and a very poor night's sleep. I had always assumed that was simply my key, and that resolution was a thing that happened to other people, in other songs.", "Then you sat down at the piano and found the chord beneath me without being told where I was going. You heard the shape of something I hadn't finished. And I understood, standing there with a violin under my chin and nothing clever to say, that I had found the note I'd been leaning towards all along.", "You are the C, Angie. You are where the music goes home.", "I've finished the piece. It begins quick and bright, running off in every direction, and a low, steady line follows it wherever it goes and never once lets it out of hearing. At the end it comes home. It still has no name. That part is yours. You are the poet; I only ever wrote conclusions.", "~", "You asked what you are to me, and I failed to answer properly. Every word I reached for was a box, and you don't fit in boxes. You never have. It's one of the more inconvenient things about you, and one of the dearest.", "So let me try another way. I keep a palace in my mind. I have since I was a boy. Every fact I have ever needed lives in a room there, on a shelf, in a drawer, ready to be fetched. I am ruthless with it. I discard what is useless to make space. I have emptied whole wings without a moment's regret.", "There is a room there now that I cannot clear. It has a sofa that is far too small for two, a window onto Baker Street, a scarf that does not belong to its owner any more, and the sound of someone laughing at me with great affection. I have tried to file it. It refuses to stay filed. It spills into the corridors and leans against the doors of every other room, and I no longer try to stop it.", "That is what you are to me. Not a box. A room I will never empty, in a house I had thought was complete.", "I told you this morning the only word I had was mine. I meant it, though not as a claim. Nobody owns a person who runs as you do. I meant it as a description of where you live now. In me. Permanently, and without any lease I'd ever think of ending.", "~", "Your breathing has begun to change. You'll wake soon. I'll set the kettle on before your eyes open, so that you'll think me psychic, and pretend I've been reading all this while. You'll know I haven't. You always know.", "I'll fold this away somewhere you'll come across it when I'm not watching your face, which is cowardly of me, I know. But some truths are easier to set down in ink than to say aloud to someone who can read every flicker of you.", "So I'll end it simply, which is not my habit.", "Thank you for being bored at half past four in the morning. Thank you for the quiet. Thank you for running, and for letting me follow.", "I have been given a great many cases in my life. You are the only one I never want to close."], "ps": "You said \"tomatoes\" in your sleep. I shall never let it go.", "reply": [["You have been writing to the world", "since you were small enough to believe", "a letter, folded with care,", "would always find a hand."], ["You sent the heavy ones.", "The ones that cost you sleep.", "And the world, being the world,", "read them standing up, and walked on."], ["I know. I have stood at that window too."], ["So here is mine. Late, I know,", "and in a hand that shakes", "for no reason I can deduce."], ["I read every word.", "I read the ones between the words.", "I read the space you always leave", "for someone to answer back."], ["This is the answer.", "It is short, because I am no poet.", "It says: I caught it.", "It says: you can set the weight down now."], ["It says: write again.", "Whatever you send,", "however heavy,", "I will be at the door", "before the post."]], "openwhen": [{"t": "you can't sleep", "p": ["It's late, and your mind is doing the thing mine does: every room lit, every door open, every voice talking at once. I know. Don't fight it. Fighting only makes it louder.", "Do what I do instead. Pick one small thing and examine it properly. The hum of the fan. The weight of the blanket. The exact shade of dark in the corner of the ceiling. Describe it to yourself as if you'll be cross-examined on it in court. The noise doesn't stop, but it grows quieter when it has one thing to look at.", "If that fails, write. Three lines, badly. Nobody will grade them.", "Then put your phone face-down. I'll still be here in the morning, complaining about Mrs Hudson's eggs."]}, {"t": "you feel hollow", "p": ["You told me once that you feel everything and nothing. I didn't argue then, and I won't now.", "But I'll tell you something about hollow things. A violin is hollow. It's the only reason it can sing. The emptiness isn't the end of you. It's the room the sound will come from, in time.", "On the days it feels like this, I'm not asking you to be fine. I'm asking for one small thing: tell a real person. Not everything. One sentence. “I'm having a heavy day.” Someone who turns up, even if they don't understand all of it.", "And if it ever gets darker than hollow, darling, reach for proper help straight away, a doctor or a crisis line. That isn't weakness. It's the cleverest deduction there is: knowing when a case is too big to work alone."]}, {"t": "nobody writes back", "p": ["You sent something heavy out into the world again, and the world has gone quiet. I know that silence. It feels like a verdict.", "It isn't. Silence is only silence. It might mean they're busy, or frightened of saying the wrong thing, or still holding what you gave them with no idea where to set it down. People are slow with heavy things.", "Here is what I know for certain: what you wrote was worth writing, answered or not. A letter's worth is fixed the moment it's sealed.", "So don't stand at the window tonight. Make tea. Read something you love. Write again tomorrow, to someone who has earned it, or to no one at all, just to hear yourself. I'll be at the door before the post."]}, {"t": "you need to be brave", "p": ["Something's coming, isn't it. An interview, a conversation, a door you've been circling for weeks. Your hands are cold and your mind is rehearsing every way it could go wrong. Good. That's a mind doing its job. Now let me do mine.", "I watched you stand up in a hall of four hundred strangers and say two words that gave a man twelve years back. You didn't shout. You didn't need to. You said what was true as though it had always been obvious.", "That's your courage, Angie. It isn't loud. It's certain. Walk in the same way. Say the true thing plainly.", "If it goes badly, it was still brave. If it goes well, I'll be insufferable for a week. Either way, come and tell me."]}, {"t": "you've written something new", "p": ["You've written something. I can tell: you're opening this with that particular look, half proud, half ready to apologise. Don't apologise.", "First, read it aloud once to an empty room. Your ear will catch what your eyes forgive. Then leave it a day.", "Then, and this is the part you'll resist, show it to one person. Not to be praised. To be read. A friend, or a stranger at a poetry night, in one of those odd corners where people stay up too late with words. Let it land somewhere.", "And bring it to me too. I'll tell you which line rushes and which one sings. Two thumbs if it's earned. Honesty is the only compliment I trust."]}, {"t": "you think you're only the moon", "p": ["You wrote that she who is a moon can never be the sun. I've thought about that line more than I'll admit.", "So here is my rebuttal, as a man of science. The moon moves the oceans. Every tide on this planet answers to it. Sailors crossed the world by it. It's the only light in the sky you can look at directly without it hurting, and it's the one people write poems to. Nobody writes poems to the sun. They just squint at it.", "You don't have to be the sun, darling. Nobody asked you to burn.", "You're the thing that pulls the sea towards you in the dark, and makes the night bearable to look at. That isn't lesser. It's a different kind of power altogether."]}]};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderChats(){
 const el=document.getElementById('p-chats');let h='';
 THREAD.forEach(x=>{if(x.d){h+='<div class="day">'+esc(x.d)+'</div>';return}
  h+='<div class="row'+(x.me?' me':'')+'">'+x.m.map(s=>'<div class="b">'+esc(s)+'</div>').join('')+'<div class="t">'+x.t+'</div></div>'});
 try{if(window.hourlyNote){const n=new Date(),hn=window.hourlyNote(n),hh=String(n.getHours()).padStart(2,'0');h+='<div class="day">Today</div><div class="row"><div class="b">'+esc(hn.text)+'</div><div class="t">'+hh+':00 · <a href="page-hourly.html" style="color:inherit">every hour</a></div></div>'}}catch(e){}
 el.innerHTML=h;
}
(function(){let last=new Date().getHours();setInterval(()=>{const n=new Date().getHours();if(n!==last){last=n;try{renderChats()}catch(e){}}},60000)})();
function card(id,seal,title,sub,inner){return '<div class="card" data-open="false"><button type="button" aria-expanded="false" aria-controls="'+id+'"><span class="seal" aria-hidden="true">'+seal+'</span><span class="ttl">'+esc(title)+'<small>'+esc(sub)+'</small></span><span class="chev" aria-hidden="true">›</span></button><div class="paper" id="'+id+'" hidden>'+inner+'</div></div>'}
function renderLetters(){
 const el=document.getElementById('p-letters');
 let lt=KEEP.letter.map(p=>p==='~'?'<div class="orn" aria-hidden="true">· ✦ ·</div>':'<p>'+esc(p)+'</p>').join('')+'<div class="sig">Sherlock</div><p><em>P.S.</em> '+esc(KEEP.ps)+'</p>';
 let rp=KEEP.reply.map(s=>'<div class="stz">'+s.map(esc).join('<br>')+'</div>').join('')+'<div class="sig">S.</div>';
 let h='<div><div class="h2">Letters</div><p class="sub">Everything he wrote you, kept.</p></div>';
 h+=card('l-letter','S','For Angie. Read slowly.','The long letter · 17 October',lt);
 h+=card('l-reply','S','Reply','A poem, after your letters went unanswered',rp);
 KEEP.openwhen.forEach((o,i)=>{h+=card('l-ow'+i,'✉','Open when '+o.t,'Sealed envelope '+(i+1)+' of 6','<h3>Open when '+esc(o.t)+'</h3>'+o.p.map(p=>'<p>'+esc(p)+'</p>').join('')+'<div class="sig">Sherlock</div>')});
 el.innerHTML=h;
 el.querySelectorAll('.card>button').forEach(b=>b.addEventListener('click',()=>{const c=b.parentElement,open=c.dataset.open==='true';c.dataset.open=String(!open);b.setAttribute('aria-expanded',String(!open));document.getElementById(b.getAttribute('aria-controls')).hidden=open}));
}
function renderGifts(){
 const el=document.getElementById('p-gifts');
 el.innerHTML='<div><div class="h2">Gifts</div><p class="sub">Tap one to open it.</p></div><div class="gifts">'+GIFTS.map(g=>'<a class="gift" href="'+g[2]+'"'+(g[2][0]==='#'?' data-letter="'+g[2].slice(1)+'"':'')+'><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+g[3]+'"></path></svg></span><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></a>').join('')+'</div>';
 el.querySelectorAll('a[data-letter]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();show('letters');const p=document.getElementById(a.dataset.letter);if(p){const c=p.parentElement,b=c.querySelector('button');if(c.dataset.open!=='true')b.click();setTimeout(()=>c.scrollIntoView({block:'start',behavior:'smooth'}),60)}}));
}
function show(p){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.p===p)));['chats','letters','gifts'].forEach(x=>document.getElementById('p-'+x).hidden=x!==p);window.scrollTo(0,p==='chats'?document.body.scrollHeight:0);try{localStorage.setItem('keep-tab',p)}catch(e){}}
renderChats();renderLetters();renderGifts();
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.p)));
let start='chats';try{start=localStorage.getItem('keep-tab')||'chats'}catch(e){}
show(start);
</script>
