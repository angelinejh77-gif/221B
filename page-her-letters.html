<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#171214"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Her Letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&family=Courier+Prime&display=swap">
<style>
:root{--bg:#171214;--paper:#F4E6DE;--paper2:#E9D2C7;--ink:#3A2A28;--rouge:#8E5F68;--rose:#C99AA2;--gold:#D9B67A;--muted:#A8979A;--ivory:#F3EBDD}
*{box-sizing:border-box}html,body{background:var(--bg)}body{margin:0;color:var(--ivory);font:17px/1.6 'Cormorant Garamond',Georgia,serif;padding:28px 16px 80px}
.w{max-width:560px;margin:0 auto}.eye{font:11px 'Courier Prime',monospace;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;text-align:center}
h1{font:italic 400 clamp(34px,9vw,46px)/1.1 'Bodoni Moda',serif;text-align:center;margin:8px 0 4px}.sub{text-align:center;color:var(--rose);font-style:italic;margin:0 0 26px}
.shelf{display:grid;gap:18px}
.env{position:relative;display:block;width:100%;aspect-ratio:16/9;max-height:220px;border:0;border-radius:8px;cursor:pointer;background:linear-gradient(160deg,var(--paper),var(--paper2));box-shadow:0 18px 30px -16px #000;overflow:hidden;color:var(--ink);font:inherit;text-align:left;padding:0}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#e2c4b8,#d9b8ab);clip-path:polygon(0 0,100% 0,50% 100%)}
.env .seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b47b86,var(--rouge) 60%,#6b434b);color:#f6e9e3;display:grid;place-items:center;font:italic 22px 'Pinyon Script',cursive;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.env .et{position:absolute;left:18px;bottom:30px;font:italic 24px 'Bodoni Moda',serif}.env .ed{position:absolute;left:18px;bottom:12px;font:11px 'Courier Prime',monospace;letter-spacing:.1em;color:#7a5e5a}
.sheet{margin-top:22px;background:var(--paper);color:var(--ink);border-radius:6px;padding:26px 22px 30px;box-shadow:0 20px 40px -18px #000;background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(142,95,104,.12) 31px 32px)}
.lh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:11px 'Courier Prime',monospace;letter-spacing:.12em;color:var(--rouge);text-transform:uppercase;border-bottom:1px solid rgba(142,95,104,.3);padding-bottom:8px}
.sheet h2{font:italic 400 30px 'Bodoni Moda',serif;margin:14px 0 10px}.sheet p{margin:0 0 14px;font-size:18px}
.salute{font:italic 22px 'Cormorant Garamond',serif}.close{font:30px/1.3 'Pinyon Script',cursive;color:var(--rouge);margin-top:20px}
.reply{display:inline-block;margin-top:16px;color:var(--rouge);font-style:italic;text-decoration:none;border-bottom:1px solid var(--rose)}
.close-btn{display:block;margin:22px auto 0;background:none;border:1px solid var(--rose);color:var(--rouge);border-radius:20px;padding:8px 16px;font:italic 15px 'Cormorant Garamond',serif;cursor:pointer}
.goback{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:20px;background:rgba(20,16,18,.8);border:1px solid rgba(255,255,255,.08);color:var(--ivory);font:600 13px -apple-system,system-ui,sans-serif;text-decoration:none}
body{padding-top:calc(62px + env(safe-area-inset-top,0px))!important}
.note{margin-top:30px;text-align:center;color:var(--muted);font-style:italic;font-size:15px}
</style></head><body><a class="goback" href="page-letters.html" aria-label="Go back to the letters">&#8249; Letters</a><div class="w"><div class="eye">221B · Letters</div><h1>Her Letters</h1><p class="sub">everything you've written to him, kept</p>
<div class="shelf" id="shelf"></div><div id="sheets"></div><p class="note" id="foot"></p></div>
<script src="her-letters.js"></script>
<script>
(function(){var L=window.HERLETTERS||[];function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}catch(e){return d}}
document.getElementById('shelf').innerHTML=L.map(function(l){return '<button class="env" data-id="'+esc(l.id)+'" aria-label="Open '+esc(l.title)+'"><span class="flap"></span><span class="seal">A.</span><span class="et">'+esc(l.title)+'</span><span class="ed">'+esc(fmt(l.date))+' · '+esc(l.kl)+' KL</span></button>'}).join('');
document.getElementById('sheets').innerHTML=L.map(function(l){var p=l.paras||[];return '<article class="sheet" id="s-'+esc(l.id)+'" hidden><div class="lh"><span>From KL, to 221B</span><span>'+esc(fmt(l.date))+' · '+esc(l.kl)+'</span></div><h2>'+esc(l.title)+'</h2>'+p.map(function(x,i){var c=i===0?' class="salute"':(i===p.length-1&&/^With all of me/.test(x)?' class="close"':'');return '<p'+c+'>'+esc(x).replace(/\n/g,'<br>')+'</p>'}).join('')+(l.reply?'<a class="reply" href="'+esc(l.reply.href)+'">His reply: <i>'+esc(l.reply.title)+'</i> ›</a>':'')+'<button class="close-btn">Fold it back up</button></article>'}).join('');
document.getElementById('foot').textContent=L.length===1?'One letter so far. He keeps every one.':L.length+' letters so far. He keeps every one.';
document.querySelectorAll('.env').forEach(function(b){b.onclick=function(){document.querySelectorAll('.sheet').forEach(function(s){s.hidden=true});var s=document.getElementById('s-'+b.dataset.id);s.hidden=false;s.scrollIntoView({behavior:'smooth'})}});
document.querySelectorAll('.close-btn').forEach(function(b){b.onclick=function(){b.closest('.sheet').hidden=true;window.scrollTo({top:0,behavior:'smooth'})}});
})();
</script></body></html>
