<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>His Typewriter</title>
<meta name="theme-color" content="#0E1013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600&family=Special+Elite&display=swap">
<style>
:root{
  --bg:#0E1013;--panel:#15181D;--line:#262A31;--text:#ECE8E1;--muted:#9A968F;
  --gold:#D2AA6A;--seal:#B23A30;--paper:#F4EEE2;--ink:#2A2320;
  --enamel:#1a1d1c;--enamel2:#0b0d0d;--chrome1:#f4f1ea;--chrome2:#8d8a84;
  --red:#9d2b25;--black:#221c18;
  --serif:"Cormorant Garamond",Georgia,serif;--sc:"Cormorant SC",Georgia,serif;--type:"Special Elite","Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.45;overflow-x:hidden;
  background:
    radial-gradient(90% 45% at 50% 18%,rgba(233,184,114,.16),transparent 70%),
    linear-gradient(180deg,#0E1013 0,#0E1013 52%,#1b130c 52.2%,#120c07 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0px) 0 calc(150px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 2px 8px}
header h1{margin:0;font:600 21px/1 var(--sc);letter-spacing:.14em;color:var(--gold)}
#status{font:italic 14px/1.25 var(--serif);color:var(--muted);text-align:right;min-height:18px;transition:opacity .3s}

/* ---------- machine ---------- */
.machine{position:relative;margin:0 -4px;overflow:hidden;padding-top:2px}
.paperwin{position:relative;height:clamp(170px,calc(100svh - 600px),380px);overflow:hidden;
  -webkit-mask:linear-gradient(180deg,transparent 0,#000 26px);mask:linear-gradient(180deg,transparent 0,#000 26px)}
.carriage{position:relative;transition:transform .09s ease-out;will-change:transform}
#carriage{position:absolute;left:0;right:0;top:0;bottom:0}
.carriage.ret{transition:transform .38s cubic-bezier(.3,.1,.2,1)}
.paper{position:absolute;left:50%;bottom:0;width:var(--pw,320px);margin-left:calc(var(--pw,320px) / -2);padding:0 var(--pm,18px) 6px;
  background:
    radial-gradient(120% 60% at 30% 10%,rgba(255,255,255,.55),transparent 60%),
    repeating-linear-gradient(90deg,rgba(120,100,70,.018) 0 1px,transparent 1px 4px),
    var(--paper);
  box-shadow:0 0 0 1px rgba(0,0,0,.05),0 -6px 24px rgba(0,0,0,.45);color:var(--black)}
.paper.out{animation:pullOut .7s cubic-bezier(.5,0,.8,.4) forwards}
.paper.in{animation:feedIn .9s cubic-bezier(.2,.8,.3,1)}
@keyframes pullOut{to{transform:translateY(-130%) rotate(-3deg);opacity:.0}}
@keyframes feedIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.lhead{padding:22px 0 18px;text-align:center;font:600 10px/1.4 var(--sc);letter-spacing:.32em;color:rgba(80,60,40,.38);text-shadow:0 1px 0 rgba(255,255,255,.7)}
.lhead span{display:block;font:italic 11px var(--serif);letter-spacing:.04em;color:rgba(80,60,40,.32)}
.lines{position:relative}
.ln{height:var(--lh,22px);white-space:nowrap;font:var(--fs,15px)/var(--lh,22px) var(--type)}
.ln.fed{animation:feed .14s ease-out}
@keyframes feed{from{transform:translateY(var(--lh,22px))}}
.ch{display:inline-block;width:var(--cw,9px);text-align:center;vertical-align:top}
.ln.s .ch{color:var(--red)}
.ch.new{animation:hit .12s ease-out}
@keyframes hit{from{transform:translateY(-3px) scale(1.15);opacity:0}}
.cursor{display:inline-block;width:var(--cw,9px);height:2px;vertical-align:bottom;margin-bottom:3px;background:rgba(157,43,37,.55);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.margin-mark{position:absolute;top:0;bottom:0;width:1px;background:rgba(157,43,37,.12)}

.platen{position:relative;height:30px;margin:0 6px;z-index:3;border-radius:15px;
  background:linear-gradient(180deg,#3a3a3a 0,#0c0c0c 30%,#1b1b1b 55%,#050505 100%);box-shadow:0 4px 8px rgba(0,0,0,.6)}
.platen::before{content:"";position:absolute;left:12%;right:12%;top:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}
.knob{position:absolute;top:-2px;width:22px;height:34px;border-radius:7px;background:linear-gradient(90deg,#0b0b0b,#3a3735 40%,#0b0b0b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.knob.l{left:-6px}.knob.r{right:-6px}
.bail{position:absolute;left:18%;right:18%;top:7px;height:3px;border-radius:2px;background:linear-gradient(180deg,var(--chrome1),var(--chrome2));box-shadow:0 1px 1px rgba(0,0,0,.6)}
.bail::before,.bail::after{content:"";position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#111,#000);border:1px solid #444}
.bail::before{left:22%}.bail::after{right:22%}
.lever{position:absolute;left:-2px;top:-26px;width:58px;height:58px;border:none;background:none;padding:0;z-index:4}
.lever svg{width:100%;height:100%;transform-origin:52px 40px;transition:transform .15s}
.lever.pull svg{transform:rotate(-24deg)}

.body{position:relative;margin-top:-8px;padding:16px 10px 12px;border-radius:26px 26px 18px 18px;z-index:2;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.08),transparent 50%),
    linear-gradient(180deg,#232726,var(--enamel) 30%,var(--enamel2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(0,0,0,.6),0 18px 30px rgba(0,0,0,.6)}
.body::after{content:"";position:absolute;left:12px;right:12px;top:8px;bottom:8px;border-radius:20px 20px 12px 12px;border:1px solid rgba(210,170,106,.35);pointer-events:none}
.basket{position:relative;height:74px;margin:-6px 0 6px}
.basket svg{position:absolute;inset:0;width:100%;height:100%}
.decal{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font:600 10px/1 var(--sc);letter-spacing:.42em;color:var(--gold);opacity:.85;white-space:nowrap;padding-left:.42em}
.decal i{font:italic 11px var(--serif);letter-spacing:.05em;color:rgba(210,170,106,.7)}
.keys{position:relative;z-index:2;display:flex;flex-direction:column;gap:3px}
.row{display:flex;justify-content:center;gap:3px}
.k{flex:1 1 0;max-width:40px;height:42px;border:none;background:none;padding:0;display:grid;place-items:center;touch-action:manipulation}
.k span{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#fbf6e9 0 52%,#d8d0bf 56%,#2b2b2b 60%,#0a0a0a 68%,#bfbab0 72%,#6b6862 82%,#2b2a28 100%);
  box-shadow:0 3px 0 #000,0 4px 6px rgba(0,0,0,.6);font:13px/1 var(--type);color:#1a1612;text-transform:lowercase;transition:transform .05s,box-shadow .05s}
.k.wide{max-width:none;flex:5}.k.wide span{width:100%;border-radius:12px;height:20px;background:linear-gradient(180deg,#3b3b3b,#111);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.2);color:#8a857c;font:italic 12px var(--serif)}
.k.fn span{background:radial-gradient(circle at 50% 38%,#e8d3a8 0 52%,#c2a46f 56%,#2b2b2b 60%,#0a0a0a 68%,#bfbab0 72%,#6b6862 82%,#2b2a28 100%);font-size:14px}
.k.fn.on span{background:radial-gradient(circle at 50% 38%,#f0b3a3 0 52%,#c06a5a 56%,#2b2b2b 60%,#0a0a0a 68%,#bfbab0 72%,#6b6862 82%,#2b2a28 100%)}
.k.dn span,.k:active span{transform:translateY(3px);box-shadow:0 0 0 #000,0 1px 2px rgba(0,0,0,.6)}
.caps .k:not(.fn):not(.wide) span{text-transform:uppercase}

.controls{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 13px/1.1 var(--sc);letter-spacing:.1em;padding:0 8px}
.btn.gold{background:linear-gradient(180deg,#e2bd7f,#b88c46);color:#1d140a;border-color:#e8c88f}
.btn:disabled{opacity:.45}
#hid{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}

/* ---------- folder ---------- */
.folder{position:relative;margin-top:28px;padding:30px 14px 16px;border-radius:4px 10px 8px 8px;color:#3b2a1e;
  background:linear-gradient(180deg,#c9a46b,#b48d55);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.folder::before{content:"";position:absolute;left:0;top:-16px;width:44%;height:18px;border-radius:8px 14px 0 0;background:#c9a46b}
.folder h2{position:absolute;left:12px;top:-11px;margin:0;font:600 12px/1 var(--sc);letter-spacing:.22em;color:#4a3420}
.folder p{margin:0 0 12px;font:italic 15px/1.3 var(--serif);color:#4a3420}
#pages{display:flex;flex-direction:column;gap:8px}
.pg{display:block;width:100%;min-height:56px;text-align:left;border:none;padding:9px 12px;border-radius:2px;background:var(--paper);color:var(--black);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.pg:nth-child(odd){transform:rotate(-.5deg)}.pg:nth-child(even){transform:rotate(.4deg)}
.pg .d{font:600 10px/1 var(--sc);letter-spacing:.16em;color:#8b6b4a}
.pg .t{margin-top:5px;font:13px/1.35 var(--type);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .t i{font-style:normal;color:var(--red)}
.none{padding:14px;border:1px dashed rgba(74,52,32,.5);border-radius:6px;text-align:center;font:italic 15px var(--serif);color:#4a3420}
.foot{margin:26px 0 0;text-align:center;color:var(--muted);font:italic 14px var(--serif)}

.veil{position:fixed;inset:0;z-index:50;background:rgba(6,7,9,.8);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(160px + env(safe-area-inset-bottom,0px))}
.veil.on{display:block}
.vpaper{max-width:420px;margin:0 auto;padding:20px 18px 28px;background:var(--paper);color:var(--black);box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-.5deg);animation:up .4s ease-out}
@keyframes up{from{transform:translateY(30px) rotate(-.5deg);opacity:0}}
.vpaper .lhead{padding-top:4px}
.vpaper .vl{font:14px/22px var(--type);white-space:pre-wrap;word-break:break-word;min-height:22px}
.vpaper .vl.s{color:var(--red)}
.vbtns{max-width:420px;margin:14px auto 0;display:flex;gap:10px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);top:calc(14px + env(safe-area-inset-top,0px));transform:translateY(-20px);opacity:0;z-index:60;padding:9px 16px;border-radius:20px;background:#1d2026;border:1px solid var(--line);color:var(--text);font:italic 15px var(--serif);transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<style>.back221{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:rgba(20,22,26,.86);color:#F3EDE2;font:600 13px -apple-system,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}</style>
<a class="back221" href="#" onclick="history.back();return false;" aria-label="Back to Messages from 221B">&#8592; 221B</a>

<div class="wrap">
  <header><h1>His Typewriter</h1><div id="status" aria-live="polite">Type to him. Then pause.</div></header>

  <div class="machine" id="machine">
    <div class="paperwin" id="paperwin">
      <div class="carriage" id="carriage">
        <div class="paper" id="paper">
          <div class="lhead">221B BAKER STREET<span>on the desk by the window</span></div>
          <div class="lines" id="lines"></div>
        </div>
      </div>
    </div>
    <div class="carriage" id="carriage2">
      <div class="platen"><div class="knob l"></div><div class="knob r"></div><div class="bail"></div>
        <button class="lever" id="lever" aria-label="Carriage return">
          <svg viewBox="0 0 58 58" aria-hidden="true"><defs><linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#bdb8ae"/><stop offset="1" stop-color="#5d5a55"/></linearGradient></defs>
            <path d="M52 40 C40 34 24 22 8 12" stroke="url(#cr)" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M52 40 C40 34 24 22 8 12" stroke="rgba(0,0,0,.35)" stroke-width="1" fill="none" transform="translate(0 2)"/>
            <circle cx="8" cy="12" r="6" fill="#111" stroke="#555"/><circle cx="52" cy="40" r="5" fill="url(#cr)"/></svg>
        </button>
      </div>
    </div>
    <div class="body">
      <div class="basket"><svg id="fan" aria-hidden="true"></svg><div class="decal">NO. 221 <i>· London</i></div></div>
      <div class="keys" id="keys"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="kbd">Phone keyboard</button>
    <button class="btn gold" id="pull">Pull the page</button>
  </div>
  <textarea id="hid" autocapitalize="sentences" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type on the typewriter"></textarea>

  <section class="folder">
    <h2>PAGES, KEPT</h2>
    <p>Every page you pull out is slipped in here, his red lines and your black ones together.</p>
    <div id="pages"></div>
  </section>
  <p class="foot">He leaves a sheet in the machine for you. Always.</p>
</div>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="A kept page">
  <div class="vpaper" id="vpaper"></div>
  <div class="vbtns"><button class="btn" id="vdel">Throw away</button><button class="btn gold" id="vclose">Back in the folder</button></div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function store(k,v){try{if(v===undefined){var s=localStorage.getItem(k);return s?JSON.parse(s):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---------- geometry ---------- */
var CW=9,LH=22,FS=15,PW=320,PM=18,COLS=30;
function layout(){
  var W=$("machine").clientWidth;PW=Math.min(340,W-44);
  CW=W<370?8.4:9;FS=W<370?14:15;
  COLS=Math.floor((PW-PM*2)/CW);
  var r=document.documentElement.style;r.setProperty("--pw",PW+"px");r.setProperty("--cw",CW+"px");r.setProperty("--fs",FS+"px");r.setProperty("--lh",LH+"px");r.setProperty("--pm",PM+"px");
  drawFan();shift(false);
}

/* ---------- audio ---------- */
var AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
var NB=null;
function nbuf(c){if(!NB){NB=c.createBuffer(1,c.sampleRate*.5|0,c.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function burst(t,dur,type,freq,q,vol){var c=AC;var s=c.createBufferSource();s.buffer=nbuf(c);var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;var g=c.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t,Math.random()*.3);s.stop(t+dur+.01)}
function thud(t,f0,vol,dur){var c=AC;var o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*.4,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
function sClack(space){var c=ac();if(!c)return;var t=c.currentTime;
  if(space){burst(t,.04,"lowpass",900,1,.25);thud(t,90,.35,.06);return}
  var v=.75+Math.random()*.3;burst(t,.028,"bandpass",2600+Math.random()*900,1.4,.7*v);burst(t+.004,.05,"bandpass",1100,2,.35*v);thud(t,170+Math.random()*30,.55*v,.07);
  burst(t+.045,.02,"highpass",4000,1,.12)}
function sBell(){var c=ac();if(!c)return;var t=c.currentTime;[[2480,.22],[5150,.07],[7330,.03]].forEach(function(p){var o=c.createOscillator(),g=c.createGain();o.frequency.value=p[0];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.003);g.gain.exponentialRampToValueAtTime(.0008,t+1.6);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.7)})}
function sReturn(){var c=ac();if(!c)return;var t=c.currentTime;for(var i=0;i<5;i++)burst(t+i*.022,.015,"bandpass",3200,3,.35);
  burst(t+.08,.32,"bandpass",700,.7,.18);thud(t+.4,120,.6,.09);burst(t+.4,.03,"bandpass",2000,1.5,.4)}
function sPull(){var c=ac();if(!c)return;var t=c.currentTime;for(var i=0;i<14;i++)burst(t+i*.03,.012,"bandpass",2800,3,.22);burst(t+.1,.5,"highpass",2500,.5,.12)}
function sFeed(){var c=ac();if(!c)return;var t=c.currentTime;for(var i=0;i<22;i++)burst(t+.1+i*.035,.012,"bandpass",2400,3,.18)}

/* ---------- typebar fan ---------- */
var fanBars=[],strikeX=0,strikeY=0,fanW=0,fanH=74;
function drawFan(){
  var svg=$("fan");fanW=svg.clientWidth||340;fanH=svg.clientHeight||74;
  svg.setAttribute("viewBox","0 0 "+fanW+" "+fanH);
  var cx=fanW/2,cy=-14,n=30,html='<defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e5dc"/><stop offset="1" stop-color="#6d6a64"/></linearGradient></defs>';
  html+='<path d="M'+(cx-150)+' '+(fanH)+' A150 150 0 0 1 '+(cx+150)+' '+fanH+'" fill="none"/>';
  html+='<ellipse cx="'+cx+'" cy="'+(cy+20)+'" rx="122" ry="86" fill="rgba(0,0,0,.45)"/>';
  fanBars=[];
  for(var i=0;i<n;i++){var a=(18+i*(144/(n-1)))*Math.PI/180;
    var x1=cx+Math.cos(a)*112,y1=cy+Math.sin(a)*80,x2=cx+Math.cos(a)*46,y2=cy+Math.sin(a)*34;
    fanBars.push([x1,y1,x2,y2]);
    html+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="url(#bar)" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>'}
  html+='<rect x="'+(cx-40)+'" y="0" width="80" height="7" rx="2" fill="#7a1f1a"/><rect x="'+(cx-40)+'" y="3.5" width="80" height="3.5" fill="#141010"/>';
  html+='<circle cx="'+(cx-64)+'" cy="7" r="13" fill="#0a0a0a" stroke="#555" stroke-width="1.5"/><circle cx="'+(cx-64)+'" cy="7" r="9" fill="#2a1414"/><circle cx="'+(cx-64)+'" cy="7" r="2.5" fill="#bbb"/>';
  html+='<circle cx="'+(cx+64)+'" cy="7" r="13" fill="#0a0a0a" stroke="#555" stroke-width="1.5"/><circle cx="'+(cx+64)+'" cy="7" r="9" fill="#2a1414"/><circle cx="'+(cx+64)+'" cy="7" r="2.5" fill="#bbb"/>';
  html+='<path d="M'+(cx-9)+' 0 L'+cx+' 9 L'+(cx+9)+' 0" fill="none" stroke="#d9d4ca" stroke-width="2"/>';
  html+='<line id="strike" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0"/>';
  svg.innerHTML=html;
}
function strike(ch){
  var el=document.getElementById("strike");if(!el||!fanBars.length||RM)return;
  var b=fanBars[(ch.charCodeAt(0)*7)%fanBars.length],t0=performance.now(),tx=fanW/2,ty=2;
