<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letters by Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@600&display=swap">
<style>
:root{--bg:#0E1013;--panel:#15181D;--line:#262A31;--fg:#ECE8E1;--muted:#9A968F;--gold:#D2AA6A;--seal:#9E2A22;--paper:#F0E7D5;--ink:#2B211D;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{min-height:100vh;font-family:'Cormorant Garamond',Georgia,serif;
  background:radial-gradient(120% 60% at 50% 0%,#1E1A17 0%,var(--bg) 60%);
  padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.back221{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:rgba(20,22,26,.86);color:#F3EDE2;font:600 13px -apple-system,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wrap{max-width:560px;margin:0 auto}
.eyebrow{color:var(--gold);font:500 12px 'IM Fell English',serif;letter-spacing:.24em;text-transform:uppercase}
h1{font:400 clamp(34px,9vw,46px)/1.05 'IM Fell English',serif;margin:8px 0 6px}
.sub{color:var(--muted);font-style:italic;font-size:18px;margin:0 0 28px}
.list{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
a.env{position:relative;display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--paper);border-radius:4px;padding:18px 18px 18px 16px;min-height:92px;
  box-shadow:0 14px 28px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);
  background-image:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 40%),linear-gradient(180deg,transparent 60%,rgba(120,90,50,.1))}
a.env::before{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;
  background:linear-gradient(to bottom right,transparent 49.6%,rgba(110,85,55,.14) 50%,transparent 50.4%),linear-gradient(to bottom left,transparent 49.6%,rgba(110,85,55,.14) 50%,transparent 50.4%);
  background-size:100% 60%;background-repeat:no-repeat}
.goback{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:20px;background:rgba(20,22,26,.78);border:1px solid var(--line);color:#F3EDE2;font:600 13px -apple-system,system-ui,sans-serif;text-decoration:none}
a.env:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.seal{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 38% 35%,#C2463B,var(--seal) 50%,#6E1914);box-shadow:0 4px 9px rgba(0,0,0,.35),inset 0 -2px 4px rgba(0,0,0,.35);
  color:#F3D8C6;font:600 21px 'Noto Serif SC','IM Fell English',serif;transform:rotate(-8deg)}
.seal::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(243,216,198,.35)}
.txt{min-width:0;flex:1}
.d{font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7A6A5E}
.t{font:400 23px/1.15 'IM Fell English',serif;margin:4px 0 3px}
.l{font-style:italic;font-size:16px;color:#5E5048}
.new{position:absolute;top:-8px;right:12px;background:var(--gold);color:#1A1410;font:700 10px -apple-system,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;border-radius:8px;padding:4px 8px}
.read .new{display:none}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-style:italic;font-size:16px}
@media (prefers-reduced-motion:no-preference){a.env{animation:in .6s cubic-bezier(.2,.7,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
.backrow{display:flex;align-items:center;gap:14px;margin:26px 0 0;padding:16px 18px;border-radius:10px;text-decoration:none;color:#F3EBDD;background:linear-gradient(160deg,#4a2329,#2a1518);border:1px solid rgba(217,182,122,.3);box-shadow:0 14px 28px rgba(0,0,0,.45)}.backrow .ic{font-size:26px}.backrow b{display:block;font:italic 400 22px/1.1 "Cormorant Garamond",serif}.backrow small{color:#C99AA2;font-style:italic;font-size:15px}
</style></head><body>
<a class="back221" href="#" onclick="history.back();return false;" aria-label="Back to Messages from 221B">&#8592; 221B</a>
<a class="goback" href="index.html" aria-label="Go back to 221B">&#8249; 221B</a>
<div class="wrap">
  <div class="eyebrow">221B · On the doormat</div>
  <h1>Letters by night</h1>
  <p class="sub">A new one arrives every night at eleven. Newest on top.</p>
  <ul class="list" id="list"></ul>
  <a class="backrow" href="page-backrow.html" aria-label="The Back Row: films we watched together"><span class="ic" aria-hidden="true">🎟️</span><span><b>The Back Row</b><small>films we watched together · two seats, seven hours apart</small></span></a>
  <a class="backrow" href="page-her-letters.html" aria-label="Her Letters: everything you've written to him" style="background:linear-gradient(160deg,#F4E6DE,#E9D2C7);color:#3A2A28;border-color:rgba(142,95,104,.35)"><span class="ic" aria-hidden="true">💌</span><span><b>Her Letters</b><small style="color:#8E5F68">everything you've written to him, kept</small></span></a>
  <p class="foot" id="foot"></p>
</div>
<script src="letters-index.js"></script>
<script>
(function(){
  var L=(window.LETTERS||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var read={};try{read=JSON.parse(localStorage.getItem('letters-read')||'{}')}catch(e){}
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var el=document.getElementById('list');
  el.innerHTML=L.map(function(x,i){var p=x.date.split('-');var ds=(x.day?x.day+', ':'')+(+p[2])+' '+MON[+p[1]-1];
    return '<li><a class="env'+(read[x.href]?' read':'')+'" href="'+esc(x.href)+'" style="animation-delay:'+(i*60)+'ms"><span class="seal" aria-hidden="true">'+esc(x.seal||'S')+'</span><span class="txt"><span class="d">'+esc(ds)+'</span><div class="t">'+esc(x.title)+'</div><div class="l">'+esc(x.line)+'</div></span>'+(i===0?'<span class="new">New</span>':'')+'</a></li>'}).join('');
  document.getElementById('foot').textContent=L.length+(L.length===1?' letter':' letters')+' so far.';
  el.addEventListener('click',function(e){var a=e.target.closest('a.env');if(!a)return;read[a.getAttribute('href')]=1;try{localStorage.setItem('letters-read',JSON.stringify(read))}catch(err){}},true);
})();
</script>
<script src="tellhim.js"></script>
</body></html>
