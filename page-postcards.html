</head><body>
<title>Postcards from Saturday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Caveat:wght@500;600&family=Kalam:wght@400&family=Courier+Prime:wght@400;700&family=Karla:wght@400;600;700&display=swap">
<style>
/* Layout: one postcard at a time on a slate sorting-desk, controls beneath; "Stack" fans the deck into two arcs (morning / afternoon & night). Deliberate single dark look. */
:root{
  color-scheme: dark;
  --desk:#1f2c3a; --desk-2:#2a3b4d; --desk-line:#38506a;
  --text:#f3e7da; --muted:#a9b8c8;
  --paper:#f6eee4; --paper-2:#ece0d2; --paper-ink:#2f2340; --paper-soft:#6b5a72;
  --pink:#ff6f91; --yellow:#f2b632; --red:#d9362a; --teal:#00838a; --blue:#3d5ba9;
  --f-display:"Limelight", "Didot", Georgia, serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-her:"Kalam", "Segoe Print", cursive;
  --f-mono:"Courier Prime", "Courier New", monospace;
  --f-ui:"Karla", system-ui, -apple-system, sans-serif;
  --cw: min(340px, calc(100vw - 32px));
  --cw: clamp(250px, min(340px, calc(100vw - 32px), calc((100vh - 260px) * 0.667)), 340px);
  --cw: clamp(250px, min(340px, calc(100vw - 32px), calc((100dvh - 260px) * 0.667)), 340px);
}
html,body{background:var(--desk)}
body{
  color:var(--text); font-family:var(--f-ui); font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 28px;
  background:
    radial-gradient(120% 70% at 50% 0%, var(--desk-2), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.018) 46px 47px),
    var(--desk);
  min-height:100%;
  overflow-x:hidden;
}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:14px}
header{text-align:center; display:grid; gap:4px}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h1{font-family:var(--f-display); font-weight:400; font-size:clamp(28px, 7.4vw, 40px); line-height:1.05; margin:0; text-wrap:balance; color:var(--text)}
h1 em{font-style:normal; color:var(--pink)}
.sub{font-family:var(--f-hand); font-size:21px; color:var(--yellow); margin:0}
.tally{font-family:var(--f-mono); font-size:12px; color:var(--muted)}

/* stage + card */
.stage{width:var(--cw); position:relative; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.pc{width:100%; aspect-ratio:2/3; max-width:100%; perspective:1400px; position:relative}
.pc-inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,.7,.2,1)}
.pc.flipped .pc-inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:4px; overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px -12px rgba(0,0,0,.6), 0 3px 8px rgba(0,0,0,.35)}
.front{display:grid; grid-template-rows:1fr auto; padding:9px; background:var(--paper); border:0; margin:0; width:100%; text-align:left; cursor:pointer; color:var(--paper-ink); font:inherit}
.front:focus-visible, button:focus-visible, textarea:focus-visible{outline:3px solid var(--yellow); outline-offset:3px}
.front .art{position:relative; overflow:hidden; min-height:0}
.front .art svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.band{display:grid; grid-template-columns:1fr auto; align-items:end; gap:2px 10px; padding:10px 10px 8px; background:var(--band); color:var(--paper)}
.band .ttl{font-family:var(--f-display); font-size:clamp(19px, calc(var(--cw) * .068), 24px); line-height:1.05; text-wrap:balance; min-width:0}
.band .tm{font-family:var(--f-mono); font-weight:700; font-size:14px; letter-spacing:.06em}
.band .tag{grid-column:1 / -1; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; opacity:.85}
.no{position:absolute; top:16px; left:16px; font-family:var(--f-mono); font-size:10px; letter-spacing:.12em; background:var(--paper); color:var(--paper-ink); padding:3px 6px; border-radius:2px}
.tap-hint{position:absolute; right:16px; top:16px; font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--paper); background:rgba(47,35,64,.72); padding:3px 7px; border-radius:2px}

.back{transform:rotateY(180deg); background:
  linear-gradient(var(--paper), var(--paper)) padding-box;
  background-color:var(--paper); color:var(--paper-ink); padding:14px 14px 12px; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; gap:9px; user-select:text; -webkit-user-select:text}
.back::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(47,35,64,.025) 3px 4px)}
.back > *{flex-shrink:0}
.msgarea{position:relative; display:flow-root}
.stampwrap{float:right; position:relative; margin:0 0 6px 10px; width:62px; height:76px}
.stamp{position:absolute; inset:0; background:#fffaf2; border:4px dotted var(--paper); outline:1px solid rgba(47,35,64,.08); outline-offset:-4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; transform:rotate(3deg); box-shadow:0 1px 2px rgba(47,35,64,.2)}
.stamp-in{width:100%; height:100%; background:var(--s); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:3px 2px 2px; color:#fffaf2}
.stamp-in svg{width:34px; height:36px; display:block}
.stamp-in span{font-family:var(--f-mono); font-weight:700; font-size:7.5px; letter-spacing:.06em; white-space:nowrap}
.postmark{position:absolute; left:-10px; top:18px; width:64px; height:64px; color:rgba(47,35,64,.5); transform:rotate(-11deg); pointer-events:none; z-index:1}
.postmark svg{width:100%; height:100%; overflow:visible}
.msg{font-family:var(--f-hand); font-weight:500; font-size:clamp(17px, calc(var(--cw) * .058), 20px); line-height:1.18; margin:0; color:#2a2150; position:relative}
.msg .sig{display:block; text-align:right; font-weight:600; margin-top:2px}
.addr{clear:both; font-family:var(--f-hand); font-size:18px; line-height:1.3; padding:2px 0 4px 10px; border-left:2px solid rgba(47,35,64,.18);
  background:repeating-linear-gradient(0deg, transparent 0 22px, rgba(47,35,64,.22) 22px 23px); background-position:0 2px}
.addr .to{font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--paper-soft); margin-right:4px}
.fact{margin:0; font-family:var(--f-mono); font-size:11.5px; line-height:1.4; color:var(--paper-soft)}
.fact b{color:var(--paper-ink); letter-spacing:.12em; text-transform:uppercase; font-size:10px; margin-right:4px}
.reply{position:relative; border-top:1.5px dashed rgba(47,35,64,.3); padding-top:8px; display:grid; gap:6px}
.reply label{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--paper-soft)}
.reply textarea{width:100%; box-sizing:border-box; min-height:66px; resize:vertical; font-family:var(--f-her); font-size:16px; line-height:1.35; color:#7a1f3d;
  background:#fffaf2; border:1px solid rgba(47,35,64,.22); border-radius:3px; padding:7px 9px; color-scheme:light}
.reply textarea::placeholder{color:rgba(122,31,61,.45)}
.reply-row{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
.posted-note{font-family:var(--f-mono); font-size:11px; color:var(--paper-soft); min-width:0}
.btn-post{min-height:44px; padding:0 16px; border-radius:3px; border:0; background:var(--paper-ink); color:var(--paper); font-family:var(--f-mono); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer}
.btn-post:hover{background:#45335d}
.btn-front{min-height:44px; padding:0 12px; border-radius:3px; border:1px solid rgba(47,35,64,.3); background:transparent; color:var(--paper-ink); font-family:var(--f-mono); font-size:12px; cursor:pointer}
.posted-stamp{position:absolute; right:4px; top:-6px; pointer-events:none; color:#c42f4f; border:3px double currentColor; border-radius:6px; padding:3px 8px 2px; font-family:var(--f-mono); font-weight:700;
  font-size:16px; letter-spacing:.2em; text-align:center; line-height:1; transform:rotate(-12deg); opacity:0; mix-blend-mode:multiply; background:rgba(255,250,242,.35)}
.posted-stamp small{display:block; font-size:8.5px; letter-spacing:.14em; margin-top:2px}
.reply.is-posted .posted-stamp{opacity:.85}
.reply.thump .posted-stamp{animation:thump .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes thump{0%{opacity:0; transform:scale(2.4) rotate(-28deg)} 55%{opacity:.95; transform:scale(.9) rotate(-10deg)} 100%{opacity:.85; transform:scale(1) rotate(-12deg)}}

/* card enter */
.pc.in-next{animation:inNext .45s cubic-bezier(.2,.8,.2,1) both}
.pc.in-prev{animation:inPrev .45s cubic-bezier(.2,.8,.2,1) both}
.pc.in-pick{animation:inPick .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes inNext{from{opacity:0; transform:translateX(48px) rotate(4deg)} to{opacity:1; transform:none}}
@keyframes inPrev{from{opacity:0; transform:translateX(-48px) rotate(-4deg)} to{opacity:1; transform:none}}
@keyframes inPick{0%{opacity:0; transform:translateY(-30px) rotate(-8deg) scale(.92)} 60%{opacity:1; transform:translateY(4px) rotate(2deg)} 100%{transform:none}}

/* nav */
.nav{width:var(--cw); display:grid; grid-template-columns:48px 1fr 48px; align-items:center; gap:8px}
.arrow{width:48px; height:48px; border-radius:50%; border:1.5px solid var(--desk-line); background:var(--desk-2); color:var(--text); font-size:22px; line-height:1; cursor:pointer; display:grid; place-items:center}
.arrow:hover{border-color:var(--yellow); color:var(--yellow)}
.dots{display:flex; justify-content:center; flex-wrap:wrap; gap:6px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--desk-line); transition:background .2s, transform .2s}
.dot.replied{box-shadow:0 0 0 2px var(--desk), 0 0 0 3px var(--pink)}
.dot.on{background:var(--yellow); transform:scale(1.35)}
.tools{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; width:min(100%, 460px)}
.tbtn{min-height:44px; padding:0 14px; border-radius:3px; border:1.5px solid var(--desk-line); background:transparent; color:var(--text); font-family:var(--f-mono); font-size:13px; font-weight:700; letter-spacing:.06em; cursor:pointer; flex:1 1 auto}
.tbtn:hover{border-color:var(--yellow); color:var(--yellow)}
.tbtn.primary{background:var(--yellow); border-color:var(--yellow); color:var(--paper-ink)}
.tbtn.primary:hover{background:#ffc94a; color:var(--paper-ink)}
.shuffled{font-family:var(--f-mono); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px}
.linkbtn{min-height:44px; background:none; border:0; color:var(--pink); font:inherit; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0 4px}
.hint{font-family:var(--f-mono); font-size:11px; color:var(--muted); text-align:center; margin:0}

/* stack overview */
.stack{width:100%; display:grid; gap:10px}
.stack h2{font-family:var(--f-mono); font-weight:700; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:center; margin:6px 0 0}
.fan{display:flex; justify-content:center; padding:18px 6px 26px}
.mini{--r:0deg; --y:0px; position:relative; width:min(66px, calc((100vw - 40px) / 5.6)); aspect-ratio:2/3; max-width:100%; flex:none; margin-left:-11px; padding:4px 4px 0; border:0; border-radius:3px; background:var(--paper);
  transform:translateY(var(--y)) rotate(var(--r)); transform-origin:50% 120%; cursor:pointer; box-shadow:0 8px 16px -6px rgba(0,0,0,.6); transition:transform .25s; display:grid; grid-template-rows:1fr auto}
.mini:first-child{margin-left:0}
.mini:hover, .mini:focus-visible{transform:translateY(calc(var(--y) - 14px)) rotate(var(--r)); z-index:5}
.mini .art{position:relative; overflow:hidden}
.mini svg{position:absolute; inset:0; width:100%; height:100%}
.mini .mb{background:var(--band); color:var(--paper); font-family:var(--f-mono); font-weight:700; font-size:9px; padding:3px 0; text-align:center; margin:3px -4px 0}
.mini.cur{outline:3px solid var(--yellow); outline-offset:2px}
.mini .rp{position:absolute; top:-5px; right:-5px; width:14px; height:14px; border-radius:50%; background:var(--pink); border:2px solid var(--paper)}

@media (prefers-reduced-motion: reduce){
  .pc-inner, .pc.flipped .pc-inner{transition:none; transform:none}
  .face{backface-visibility:visible; -webkit-backface-visibility:visible; transition:opacity .35s ease, visibility .35s}
  .back{transform:none; opacity:0; visibility:hidden}
  .pc.flipped .back{opacity:1; visibility:visible}
  .pc.flipped .front{opacity:0; visibility:hidden}
  .pc.in-next, .pc.in-prev, .pc.in-pick{animation:fadeIn .3s ease both}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .reply.thump .posted-stamp{animation:fadeIn .3s ease both}
  .mini, .dot{transition:none}
}
@media (min-width:640px){
  .fan{padding-inline:20px}
  .mini{width:84px; margin-left:-8px}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.11  0 0 0 0 0.16  0 0 0 1.6 -0.72"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="#2f2340"/></pattern>

    <pattern id="dotsI" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="#2f2340"/></pattern>

  </defs>
</svg>

<div class="wrap">
  <header>
    <div class="eyebrow">Saturday 17 October 2026 · London</div>
    <h1>Postcards from <em>Saturday</em></h1>
    <p class="sub">Twelve moments, all of them yours. — SH</p>
    <div class="tally" id="tally"></div>
  </header>

  <section id="cardView" aria-label="Postcard">
    <div style="display:flex; flex-direction:column; align-items:center; gap:14px">
      <div class="stage" id="stage"><div id="card"></div></div>
      <div class="nav">
        <button class="arrow" id="prev" aria-label="Previous postcard">&#8249;</button>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <button class="arrow" id="next" aria-label="Next postcard">&#8250;</button>
      </div>
      <div class="tools">
        <button class="tbtn primary" id="flipBtn">Turn over</button>
        <button class="tbtn" id="stackBtn">Stack</button>
        <button class="tbtn" id="shuffleBtn">Shuffle</button>
        <button class="tbtn" id="todayBtn">Today's card</button>
      </div>
      <div class="shuffled" id="shuffledNote" hidden>Shuffled <button class="linkbtn" id="unshuffle">Put back in order</button></div>
      <p class="hint">Swipe, or use the arrow keys. Tap a card to turn it over.</p>
    </div>
  </section>

  <section id="stackView" class="stack" aria-label="The whole stack" hidden>
    <h2>Morning · 04:27 to 06:00</h2>
    <div class="fan" id="fanA"></div>
    <h2>Afternoon &amp; night</h2>
    <div class="fan" id="fanB"></div>
    <div style="display:flex; justify-content:center"><button class="tbtn" id="closeStack" style="flex:none">Back to the card</button></div>
  </section>
</div>

    );},
    tomato: function(){ return svg(
      '<rect width="300" height="330" fill="#ffd6de"/>'+
      '<g '+M+'><rect width="300" height="130" fill="'+PINK+'" opacity=".55"/><circle cx="214" cy="196" r="58" fill="'+Y+'"/>'+

    var c = CARDS[ci], mid=(rowLen-1)/2, off=k-mid, r=off*5.2, y=Math.abs(off)*Math.abs(off)*2.4;
    var cur = order[pos]===ci, rp = !!getReply(c.id);
    return '<button class="mini'+(cur?' cur':'')+'" style="--r:'+r.toFixed(1)+'deg; --y:'+y.toFixed(1)+'px; --band:'+c.band+'; z-index:'+(k+1)+'" data-ci="'+ci+'" aria-label="'+esc(c.title+", "+c.time+(rp?", replied":""))+'">'+
      '<div class="art">'+ART[c.id]()+'</div><div class="mb">'+c.time+'</div>'+(rp?'<span class="rp" aria-hidden="true"></span>':'')+'</button>';
  }
  function openStack(){
    var a=[0,1,2,3,4,5], b=[6,7,8,9,10,11];
    $("fanA").innerHTML = a.map(function(ci,k){return miniHtml(ci,k,a.length);}).join("");
    $("fanB").innerHTML = b.map(function(ci,k){return miniHtml(ci,k,b.length);}).join("");
    $("cardView").hidden = true; $("stackView").hidden = false;
    var cur = document.querySelector(".mini.cur"); if(cur) cur.focus({preventScroll:true});
  }
  function closeStack(){ $("stackView").hidden = true; $("cardView").hidden = false; $("stackBtn").focus({preventScroll:true}); }
  $("stackBtn").addEventListener("click", openStack);
  $("closeStack").addEventListener("click", closeStack);
  $("stackView").addEventListener("click", function(e){
    var m = e.target.closest(".mini"); if(!m) return;
    var ci = +m.getAttribute("data-ci");
    pos = order.indexOf(ci); flipped=false;
    $("stackView").hidden = true; $("cardView").hidden = false;
    render("in-pick");
  });

  render("in-pick");
})();
</script>
