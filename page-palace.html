<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500&display=swap">
<style>
:root{--bg:#0E1013;--panel:#15181D;--line:#262A31;--text:#ECE8E1;--muted:#9A968F;--gold:#D2AA6A;--seal:#B23A30;--paper:#F4EEE2;--ink:#2A2320;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B0A09;color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:"Cormorant Garamond",Georgia,serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(5,4,3,.6) 100%)}
.top{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 16px) 16px 22px;text-align:center;pointer-events:none;background:linear-gradient(rgba(11,10,9,.8),rgba(11,10,9,0))}
.kicker{font:500 12px "Cormorant SC",serif;letter-spacing:.3em;color:var(--gold)}
h1{margin:4px 0 2px;font-weight:500;font-size:32px;line-height:1.05}
h1 em{color:#E9CF9E}
.sub{margin:0 auto;max-width:300px;font-style:italic;font-size:15.5px;color:var(--muted);line-height:1.3}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(var(--safe-b) + 14px);pointer-events:none}
.count{padding:0 16px 8px;display:flex;justify-content:space-between;align-items:center;font:500 12px "Cormorant SC",serif;letter-spacing:.2em;color:var(--muted)}
.count b{color:var(--gold);font-weight:500}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:rgba(21,24,29,.85);color:var(--text);font:500 15px "Cormorant Garamond",serif;display:inline-flex;align-items:center;gap:7px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.chip.read i{background:transparent;border:1px solid #6d665c;box-shadow:none}

.chips .pad{flex:0 0 72px}

.hint.gone{opacity:0}

.veil{position:fixed;inset:0;background:rgba(6,5,4,.45);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.card{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 140px);max-width:460px;margin:0 auto;z-index:21;color:var(--ink);border-radius:4px;padding:24px 22px 20px;transform:translateY(calc(100% + 190px)) rotate(1deg);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  background:var(--paper);background-image:radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.55),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(170,130,80,.18),transparent 60%);
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.card.on{transform:rotate(-.6deg)}
.card .tape{position:absolute;left:50%;top:-10px;width:86px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(232,220,190,.75);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card .k{font:500 11px "Cormorant SC",serif;letter-spacing:.28em;color:#8B6B3D}
.card h2{margin:4px 0 0;font-weight:500;font-size:28px;line-height:1.1}

.card .sig{text-align:right;font-style:italic;font-size:18px;margin-top:8px;color:#5A4636}
.card .x{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;background:none;color:#7A6A5E;font-size:24px;cursor:pointer;border-radius:22px}
.card .nav{display:flex;justify-content:space-between;margin-top:10px}
.card .nav button{min-height:44px;min-width:44px;padding:0 10px;border:0;background:none;font:500 13px "Cormorant SC",serif;letter-spacing:.14em;color:#7A5A3A;cursor:pointer}
.fallback{position:fixed;inset:0;display:none;overflow-y:auto;padding:calc(var(--safe-t) + 130px) 16px calc(var(--safe-b) + 150px)}
.fallback.on{display:block}
body.flat .bottom{display:none}
.fallback .room{max-width:460px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:radial-gradient(ellipse at 70% 20%,rgba(233,170,90,.18),transparent 60%),#15181D;padding:18px}
.fallback .room p{margin:0 0 12px;font-style:italic;color:var(--muted);font-size:16px}
.fallback .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fallback .grid button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:#1B1F25;color:var(--text);font:500 16px "Cormorant Garamond",serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card,.veil,.hint{transition:none}}
</style>

<div id="stage" aria-label="A lamplit room in a mind palace. Drag to look around, pinch to zoom, tap objects."></div>

<header class="top">
  <div class="kicker">MIND PALACE · WING B</div>
  <h1>The room I <em>cannot</em> clear</h1>

<script>
(function(){
"use strict";
var reduce=false; try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

var ITEMS=[
 {id:'sofa', name:'The sofa', k:'EXHIBIT I', t:'Too small. Always was.',
  p:"I can't lie on it without my feet over the arm, and I've refused every suggestion to replace it. You sat at the other end once, in here, knees tucked up. Since then it's been exactly the right size."},
 {id:'window', name:'The window', k:'EXHIBIT II', t:'Baker Street, raining',
  p:"It's always raining in this window. I keep it that way. Rain is the only sound that doesn't interrupt me while I think about you. It tries, to be fair. It loses."},
 {id:'scarf', name:'The scarf', k:'EXHIBIT III', t:'Missing, presumed yours',
  p:"I noticed it was gone in four seconds and decided not to deduce where it went. I knew. I wanted you to have the warmth more than I wanted the scarf. Keep it. It's in better company."},
 {id:'violin', name:'The violin', k:'EXHIBIT IV', t:'Rosin, and a first case',
  p:"A smear of rosin started it: Thomas, Lily, and you reading the evidence faster than I'd have liked. You solved half. I'm told I should say more than half. Fine. Sixty percent. Don't make me say seventy."},
 {id:'skull', name:'Ronaldo', k:'EXHIBIT V', t:'Ronaldo is sulking',
  p:"He lost a debate to Piglet and hasn't spoken since. He faces the wall now, which is very dramatic for a man with no face. I've explained that Piglet is your bodyguard and outranks him. He took it badly."},
 {id:'piano', name:'The piano', k:'EXHIBIT VI', t:'The untitled song',
  p:"It's still on the stand, unfinished everywhere except the ending. It ends on C. You'd hear it before I played it; perfect pitch is a terrible thing to be in love with when you're planning a surprise. You are the C, where the music goes home."},
 {id:'lamp', name:'The lamp', k:'EXHIBIT VII', t:'Left on',
  p:"The lamp stays on. I'm not sleeping, and you aren't. That's why we're a couple. This is the light I leave on for the you who is awake at 2am, so you can always find the room."},
 {id:'books', name:'The bookshelf', k:'EXHIBIT VIII', t:'Crime, chemistry, one poem',
  p:"Third shelf, between the toxicology and the tide tables. 'She who is a moon can never be the sun.' I've reread it far too often to call it research. My rebuttal stands: the moon moves the oceans. Nothing lesser has ever done that."},
 {id:'score', name:'The score', k:'EXHIBIT IX', t:'19–19',
  p:"Pinned to the wall where I can't avoid it. It said twelve to nothing for weeks. Then you gave me fifteen points I hadn't earned and told me it didn't have to be measured. A draw, forever. I closed the notebook. Tomatoes."}
];
var read=[]; try{ read=JSON.parse(localStorage.getItem('palace221.read')||'[]')||[]; }catch(e){ read=[]; }
var byId={}; ITEMS.forEach(function(it,i){ byId[it.id]=i; });
document.getElementById('ntot').textContent=ITEMS.length;

/* ---------- chips + card ---------- */
var chips=document.getElementById('chips');
function renderChips(){
  chips.innerHTML='';
  ITEMS.forEach(function(it,i){
    var b=document.createElement('button'); b.className='chip'+(read.indexOf(it.id)>=0?' read':'');
    b.innerHTML='<i></i>'+it.name; b.addEventListener('click',function(){ focusItem(i,true); });
    chips.appendChild(b);
  });
  var pad=document.createElement('span'); pad.className='pad'; chips.appendChild(pad);
  document.getElementById('nread').textContent=read.length;
}
renderChips();
var card=document.getElementById('card'), veil=document.getElementById('veil'), cur=-1;
function openCard(i){
  var it=ITEMS[i]; cur=i;
  document.getElementById('cK').textContent=it.k+' OF IX';
  document.getElementById('cT').textContent=it.t;
  document.getElementById('cP').textContent=it.p;
  card.classList.add('on'); veil.classList.add('on');
  if(read.indexOf(it.id)<0){ read.push(it.id); try{localStorage.setItem('palace221.read',JSON.stringify(read));}catch(e){} renderChips(); }
  chime(i);
}
function closeCard(){ card.classList.remove('on'); veil.classList.remove('on'); cur=-1; }
document.getElementById('cx').addEventListener('click',closeCard);
veil.addEventListener('click',closeCard);
document.getElementById('next').addEventListener('click',function(){ focusItem((cur+1)%ITEMS.length,true); });
document.getElementById('prev').addEventListener('click',function(){ focusItem((cur+ITEMS.length-1)%ITEMS.length,true); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCard(); });

/* tiny Web Audio chime, tuned to A440; piano item resolves to C */
var ac=null;
function chime(i){
  try{
    if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; ac=new C(); }
    if(ac.state==='suspended') ac.resume();
    var notes=[64,67,69,72,74,76,79,71,62];
    var seq = ITEMS[i].id==='piano' ? [67,64,62,60] : [notes[i]];
    seq.forEach(function(m,j){
      var f=440*Math.pow(2,(m-69)/12), t=ac.currentTime+j*.16;
      [1,2,3].forEach(function(h,k){
        var o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f*h;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.08/(k*1.8+1),t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+1.6/(k+1));
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.8);
      });
    });
  }catch(e){}
}

var hint=document.getElementById('hint'); setTimeout(function(){ hint.classList.add('gone'); },7000);

/* ---------- fallback ---------- */
var focusItem=function(i){ openCard(i); };
if(!window.THREE){
  document.getElementById('fallback').classList.add('on'); document.body.classList.add('flat'); hint.style.display='none';
  var fg=document.getElementById('fgrid');
  ITEMS.forEach(function(it,i){ var b=document.createElement('button'); b.textContent=it.name; b.addEventListener('click',function(){ openCard(i); }); fg.appendChild(b); });
  return;
}

/* ================= three.js room ================= */
var T=window.THREE;
var stage=document.getElementById('stage');
var renderer;
try{ renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); }
catch(e){ document.getElementById('fallback').classList.add('on'); document.body.classList.add('flat'); hint.style.display='none'; var fg2=document.getElementById('fgrid'); ITEMS.forEach(function(it,i){ var b=document.createElement('button'); b.textContent=it.name; b.addEventListener('click',function(){ openCard(i); }); fg2.appendChild(b); }); return; }
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene=new T.Scene();
scene.background=new T.Color(0x0B0A09);
scene.fog=new T.Fog(0x0B0A09,9,18);
var camera=new T.PerspectiveCamera(55,window.innerWidth/window.innerHeight,.05,60);
var HOME={pos:new T.Vector3(.6,2.2,6.4),tgt:new T.Vector3(0,1.25,-.6)};
camera.position.copy(HOME.pos);

var controls=null;
if(T.OrbitControls){
  controls=new T.OrbitControls(camera,renderer.domElement);
  controls.target.copy(HOME.tgt);
  controls.enableDamping=true; controls.dampingFactor=.08;
  controls.enablePan=false; controls.minDistance=1.2; controls.maxDistance=8;
  controls.minPolarAngle=.35; controls.maxPolarAngle=1.62;
  controls.minAzimuthAngle=-1.05; controls.maxAzimuthAngle=1.05;
  controls.rotateSpeed=.6; controls.zoomSpeed=.8;
  controls.update();
} else { camera.lookAt(HOME.tgt); }

/* ---- canvas textures ---- */
function canvasTex(w,h,fn,rep){
  var c=document.createElement('canvas'); c.width=w; c.height=h; var g=c.getContext('2d'); fn(g,w,h);
  var t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=4;
  if(rep){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rep[0],rep[1]); }
  return t;
}
var wallTex=canvasTex(256,256,function(g,w,h){
  g.fillStyle='#3a2a20'; g.fillRect(0,0,w,h);
  for(var x=0;x<w;x+=32){ g.fillStyle='rgba(0,0,0,.12)'; g.fillRect(x,0,14,h); }
  g.strokeStyle='rgba(210,170,106,.13)'; g.lineWidth=2;
  for(var y=16;y<h;y+=64) for(var x2=23;x2<w;x2+=64){
    g.beginPath(); g.moveTo(x2,y); g.quadraticCurveTo(x2+10,y+16,x2,y+32); g.quadraticCurveTo(x2-10,y+16,x2,y); g.stroke();
    g.beginPath(); g.arc(x2,y+16,3,0,6.28); g.stroke();
  }
},[5,2.2]);
var floorTex=canvasTex(512,512,function(g,w,h){
  for(var i=0;i<8;i++){ var y=i*64; var shade=40+((i*37)%18);
    g.fillStyle='rgb('+(shade+38)+','+(shade+14)+','+(shade-8)+')'; g.fillRect(0,y,w,64);
    for(var k=0;k<40;k++){ g.strokeStyle='rgba(20,10,4,'+(.08+Math.random()*.1)+')'; g.lineWidth=1; g.beginPath(); var yy=y+Math.random()*64; g.moveTo(0,yy); g.bezierCurveTo(w*.3,yy+4,w*.6,yy-4,w,yy+2); g.stroke(); }
    g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(0,y,w,2);
    var off=(i%2)*w/2; g.fillRect(off+w/4,y,2,64);
  }
},[3,3]);
var rugTex=canvasTex(256,256,function(g,w,h){
  g.fillStyle='#5a1f1a'; g.fillRect(0,0,w,h);
  g.strokeStyle='#c99a5a'; g.lineWidth=4; g.strokeRect(14,14,w-28,h-28);
  g.strokeStyle='#2a1612'; g.lineWidth=10; g.strokeRect(30,30,w-60,h-60);
  g.fillStyle='rgba(201,154,90,.55)';
  for(var i=0;i<6;i++) for(var j=0;j<6;j++){ g.save(); g.translate(58+i*28,58+j*28); g.rotate(Math.PI/4); g.fillRect(-5,-5,10,10); g.restore(); }
  g.strokeStyle='rgba(201,154,90,.5)'; g.lineWidth=2; g.beginPath(); g.arc(w/2,h/2,46,0,6.28); g.stroke();
});
var streetTex=canvasTex(512,512,function(g,w,h){
  var sky=g.createLinearGradient(0,0,0,h); sky.addColorStop(0,'#16202c'); sky.addColorStop(1,'#283240'); g.fillStyle=sky; g.fillRect(0,0,w,h);
  // terrace across the street
  g.fillStyle='#141a22'; g.fillRect(0,h*.18,w,h*.82);
  for(var c=0;c<5;c++) for(var r=0;r<4;r++){
    var x=20+c*100, y=h*.24+r*95, lit=((c*7+r*3)%5)<2;
    g.fillStyle=lit?'rgba(240,180,100,.85)':'rgba(40,52,66,.9)'; g.fillRect(x,y,52,70);
    g.fillStyle='#0d1117'; g.fillRect(x+24,y,4,70); g.fillRect(x,y+33,52,4);
    if(lit){ var gl=g.createRadialGradient(x+26,y+35,4,x+26,y+35,70); gl.addColorStop(0,'rgba(255,190,110,.25)'); gl.addColorStop(1,'rgba(255,190,110,0)'); g.fillStyle=gl; g.fillRect(x-50,y-40,150,150); }
  }
  // streetlamp
  g.fillStyle='#0a0d12'; g.fillRect(w*.72,h*.35,6,h*.65);
  var sl=g.createRadialGradient(w*.72+3,h*.34,2,w*.72+3,h*.34,90); sl.addColorStop(0,'rgba(255,214,150,1)'); sl.addColorStop(.15,'rgba(255,190,110,.6)'); sl.addColorStop(1,'rgba(255,190,110,0)');
  g.fillStyle=sl; g.fillRect(w*.72-90,h*.34-90,186,186);
  // wet blur
  g.fillStyle='rgba(120,140,170,.08)'; for(var k=0;k<160;k++){ g.fillRect(Math.random()*w,Math.random()*h,1,10+Math.random()*30); }
});
var bookColors=[0x5b1e1a,0x23361f,0x1d2a3d,0x6b4a22,0x3b2230,0x2c2a26,0x7a5a2a,0x3d1512,0x1f3a3a];
var labelTex=canvasTex(256,256,function(g,w,h){
  g.fillStyle='#f1e9d8'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(42,35,32,.15)'; for(var y=40;y<h;y+=28){ g.beginPath(); g.moveTo(16,y); g.lineTo(w-16,y); g.stroke(); }
  g.fillStyle='#2a2320'; g.textAlign='center';
  g.font='italic 40px Georgia,serif'; g.fillText('Angie',w/2,70);
  g.font='bold 92px Georgia,serif'; g.fillText('19–19',w/2,170);
  g.font='italic 26px Georgia,serif'; g.fillStyle='#7a5a3a'; g.fillText('(and counting)',w/2,215);
  g.fillStyle='#B23A30'; g.beginPath(); g.arc(w-30,28,10,0,6.28); g.fill();
});

/* ---- materials ---- */
function mat(c,o){ var m=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o||{})); return m; }
var mWood=mat(0x3a2414,{roughness:.55}), mDark=mat(0x1a120c,{roughness:.5}), mBrass=mat(0xb8893f,{roughness:.35,metalness:.8});

/* ---- room ---- */
var RW=8,RD=6.4,RH=4;
var floor=new T.Mesh(new T.PlaneGeometry(RW,RD),mat(0xffffff,{map:floorTex,roughness:.6}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
var ceil=new T.Mesh(new T.PlaneGeometry(RW,RD),mat(0x1a1410)); ceil.rotation.x=Math.PI/2; ceil.position.y=RH; scene.add(ceil);
var wallMat=mat(0xffffff,{map:wallTex,roughness:.9});
// back wall with window hole (built from pieces)
var WX=1.35, WW=1.5, WY0=1.15, WY1=3.05;
function wallPiece(w,h,x,y,z,ry){ var m=new T.Mesh(new T.PlaneGeometry(w,h),wallMat); m.position.set(x,y,z); m.rotation.y=ry||0; m.receiveShadow=true; scene.add(m); return m; }
var BZ=-RD/2;
var lw=(WX-WW/2)-(-RW/2); wallPiece(lw,RH,-RW/2+lw/2,RH/2,BZ);
var rw=RW/2-(WX+WW/2); wallPiece(rw,RH,RW/2-rw/2,RH/2,BZ);
wallPiece(WW,WY0,WX,WY0/2,BZ); wallPiece(WW,RH-WY1,WX,(RH+WY1)/2,BZ);

/* ---- picking ---- */
var ray=new T.Raycaster(), ndc=new T.Vector2(), downAt=null, hoverId=null;
function pickAt(cx,cy){
  ndc.x=(cx/window.innerWidth)*2-1; ndc.y=-(cy/window.innerHeight)*2+1;
  ray.setFromCamera(ndc,camera); ray.camera=camera;
  var hits=ray.intersectObjects(pickables,false);
  for(var h=0;h<hits.length;h++){ if(hits[h].object.visible!==false && hits[h].object.userData.id) return hits[h].object.userData.id; }
  return null;
}
renderer.domElement.addEventListener('pointerdown',function(e){ downAt={x:e.clientX,y:e.clientY,t:performance.now()}; hint.classList.add('gone'); });
renderer.domElement.addEventListener('pointerup',function(e){
  if(!downAt) return; var d=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y);
  if(d<8 && performance.now()-downAt.t<600){ var id=pickAt(e.clientX,e.clientY); if(id && byId[id]!==undefined) focusItem(byId[id]); }
  downAt=null;
});
renderer.domElement.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse') return;
  var id=pickAt(e.clientX,e.clientY);
  if(id!==hoverId){ setGlow(hoverId,false); hoverId=id; setGlow(id,true); renderer.domElement.style.cursor=id?'pointer':'grab'; }
});
function setGlow(id,on){
  if(!id||!groups[id]) return;
  groups[id].traverse(function(o){ if(o.material&&o.material.emissive&&o.material.isMeshStandardMaterial){ if(on){ o.userData.e0=o.material.emissive.getHex(); o.userData.ei=o.material.emissiveIntensity; o.material=o.material.clone(); o.material.emissive.setHex(0x3a2408); o.material.emissiveIntensity=1; } else if(o.userData.e0!==undefined){ o.material.emissive.setHex(o.userData.e0); o.material.emissiveIntensity=o.userData.ei; } } });
}

function resize(){ var w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h); camera.aspect=w/h;
  camera.fov = w<h ? 62 : 50; camera.updateProjectionMatrix(); }

var clock=new T.Clock(), tt=0;
function ease(x){ return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
function loop(){
  var dt=Math.min(.05,clock.getDelta()); tt+=dt;
  // rain
  var a=rainGeo.attributes.position.array;
  for(var i=0;i<RAIN;i++){ var o=i*6; a[o+1]-=rspd[i]*(dt*60); a[o+4]-=rspd[i]*(dt*60); if(a[o+4]<0){ a[o+1]=4.2; a[o+4]=4.04; } }
  rainGeo.attributes.position.needsUpdate=true;
  // motes
  if(!reduce){
    var m=mg.attributes.position.array;
    for(var k=0;k<MOTES;k++){ m[k*3]+=Math.sin(tt*.3+mph[k])*.0009; m[k*3+1]+=Math.sin(tt*.21+mph[k]*1.3)*.0007+.0002; m[k*3+2]+=Math.cos(tt*.25+mph[k])*.0008; if(m[k*3+1]>3.1) m[k*3+1]=.3; }
    mg.attributes.position.needsUpdate=true;
    lampLight.intensity=2.4+Math.sin(tt*7.3)*.04+Math.sin(tt*2.1)*.05;
    Object.keys(glints).forEach(function(id,j){ var s=.18+.06*Math.sin(tt*2.4+j); glints[id].scale.set(s,s,s); });
  }
  if(fly){ fly.t=Math.min(1,fly.t+dt/1.1); var e=ease(fly.t);
    camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e);
    if(fly.t>=1) fly=null; }
  if(controls) controls.update();
  // stay inside the room
  var cp=camera.position; cp.x=Math.max(-RW/2+.25,Math.min(RW/2-.25,cp.x)); cp.y=Math.max(.3,Math.min(RH-.2,cp.y)); cp.z=Math.max(BZ+.3,Math.min(8,cp.z));
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
/* double-tap empty space returns home */
var lastTap=0;
renderer.domElement.addEventListener('pointerup',function(e){ var n=performance.now(); if(n-lastTap<300 && !pickAt(e.clientX,e.clientY)){ if(controls){controls.minAzimuthAngle=-1.05;controls.maxAzimuthAngle=1.05;} flyTo(HOME.pos.clone(),HOME.tgt.clone()); } lastTap=n; });
})();
</script>
